<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수확 지켜보기</title>
<style>
  :root {
    --ground: #0d1211;
    --panel: #121918;
    --raise: #182120;
    --line: #202b28;
    --ink: #e8efec;
    --mid: #9aaaa4;
    --dim: #6c7d77;
    --go: #4fc3a1;
    --seed: #dda85c;
    --lyric: #8ec5ea;
    --stop: #d2694a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --body: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 머리띠 하나에 다 넣는다. 큰 숫자 판은 화면을 절반이나 먹었다. ── */
  .bar {
    display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 42px; flex: 0 0 42px;
    border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow: hidden;
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .tabs button {
    font: inherit; color: var(--mid); background: none; border: 0; padding: 5px 12px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--raise); color: var(--ink); }
  .stats { display: flex; gap: 12px; align-items: baseline; overflow: hidden; }
  .stats i { font-style: normal; color: var(--dim); margin-right: 4px; }
  .stats b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .grow { flex: 1 1 auto; min-width: 8px; }
  .doing { color: var(--mid); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .doing span { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 7px; }
  .dot.on { background: var(--go); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  .act { display: flex; gap: 6px; }
  button.push {
    font: inherit; color: var(--ink); background: var(--raise); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 12px; cursor: pointer;
  }
  button.push.main { background: var(--go); border-color: var(--go); color: #06100d; font-weight: 600; }
  button.push:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--go); outline-offset: 1px; }

  main { flex: 1 1 auto; min-height: 0; display: flex; }

  /* ── 자료: 세 칸 ── */
  .cols { display: grid; grid-template-columns: 240px 320px minmax(0, 1fr); width: 100%; min-height: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .cols .col:nth-child(3) { grid-column: 1 / -1; } }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .col > header {
    flex: 0 0 auto; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
    color: var(--mid); font-size: 12px; display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .col > header b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col > header .tail { color: var(--dim); flex: 0 0 auto; }
  .col > header input {
    font: inherit; width: 100%; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px;
  }
  .col .body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 10px; cursor: pointer;
    border-bottom: 1px solid rgba(32,43,40,.5);
  }
  .row:hover { background: rgba(79,195,161,.07); }
  .row[aria-selected="true"] { background: rgba(79,195,161,.15); }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .mark { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .row.faint .name { color: var(--dim); }
  .empty { padding: 12px 10px; color: var(--dim); }

  .line { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 2px 12px; }
  .line em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .line span { overflow-wrap: anywhere; }
  .line:hover { background: rgba(79,195,161,.06); }

  /* ── 로그 ── */
  .logwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; width: 100%; min-height: 0; }
  @media (max-width: 900px) { .logwrap { grid-template-columns: 1fr; } }
  .log { overflow-y: auto; min-height: 0; padding: 6px 0 24px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .log p { margin: 0; padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--mid); }
  .log p.k-seed { color: var(--seed); }
  .log p.k-artist { color: var(--go); }
  .log p.k-lyric { color: var(--ink); }
  .log p.k-note { color: var(--stop); }
  .rail { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 900px) { .rail { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  .rail section { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .rail h2 { margin: 0; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .put { display: flex; gap: 6px; }
  .put input {
    font: inherit; flex: 1 1 auto; min-width: 0; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px;
  }
  .rail p.hint { margin: 0; color: var(--dim); font-size: 12px; }
  .chips { overflow-y: auto; min-height: 0; padding: 10px 12px 20px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .chips span { font-size: 11.5px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--mid); }
  .chips span.new { color: var(--seed); border-color: var(--seed); }
</style>
</head>
<body>
<div class="bar">
  <span class="brand">바이브 수확</span>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button id="tab-log" role="tab" aria-selected="true" type="button">로그</button>
    <button id="tab-files" role="tab" aria-selected="false" type="button">자료</button>
  </nav>
  <div class="stats">
    <span><i>곡</i><b id="n-song">0</b></span>
    <span><i>줄</i><b id="n-line">0</b></span>
    <span><i>아티스트</i><b id="n-artist">0</b></span>
    <span><i>안 훑음</i><b id="n-left">0</b></span>
    <span><i>받을 곡</i><b id="n-wait">0</b></span>
  </div>
  <span class="grow"></span>
  <span class="doing"><i class="dot" id="dot"></i><span id="doing">멈춰 있음</span></span>
  <div class="act">
    <button class="push main" id="start" type="button">시작</button>
    <button class="push" id="stop" type="button">멈춤</button>
  </div>
</div>

<main>
  <div class="logwrap" id="view-log">
    <div class="log" id="log"></div>
    <div class="rail">
      <section>
        <h2>씨앗 넣기</h2>
        <div class="put">
          <input id="seed" type="text" placeholder="잔나비, 검정치마" autocomplete="off">
          <button class="push" id="add" type="button">넣기</button>
        </div>
        <p class="hint">넣으면 바로 검색하고 seeds.txt 에도 적힌다.</p>
      </section>
      <section style="border-bottom:0;padding-bottom:2px">
        <h2>지금 씨앗 <span id="seed-n" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h2>
      </section>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="cols" id="view-files" hidden>
    <div class="col">
      <header><input id="find" type="search" placeholder="아티스트 찾기" autocomplete="off"></header>
      <div class="body" id="artists"></div>
    </div>
    <div class="col">
      <header><b id="head-artist">아티스트</b><span class="tail" id="tail-artist"></span></header>
      <div class="body" id="songs"></div>
    </div>
    <div class="col">
      <header><b id="head-song">곡</b><span class="tail" id="tail-song"></span></header>
      <div class="body" id="lines"></div>
    </div>
  </div>
</main>

<script>
/**
 * The harvest console: a running log with a seed box, and a three-column browser over what has
 * been collected.
 */
(function () {
  var el = function (id) { return document.getElementById(id); };
  var log = el('log');
  var fresh = {};

  /**
   * Put one line at the bottom of the log, following it only when the reader is already there.
   *
   * @param {string} kind - "seed", "artist", "lyric" or "note", for colour.
   * @param {string} text - The line itself.
   * @returns {void}
   */
  function say(kind, text) {
    var glued = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    var row = document.createElement('p');
    row.className = 'k-' + kind;
    row.textContent = text;
    log.appendChild(row);
    while (log.childNodes.length > 1500) { log.removeChild(log.firstChild); }
    if (glued) { log.scrollTop = log.scrollHeight; }
  }

  /**
   * Write the totals and the running state into the bar.
   *
   * @param {object} said - A state or count step.
   * @returns {void}
   */
  function tally(said) {
    [['곡', 'n-song'], ['줄', 'n-line'], ['아티스트', 'n-artist'],
     ['남은 아티스트', 'n-left'], ['받을 곡', 'n-wait']].forEach(function (pair) {
      if (said[pair[0]] !== undefined) {
        el(pair[1]).textContent = Number(said[pair[0]]).toLocaleString('ko-KR');
      }
    });
    if (said['지금']) { el('doing').textContent = said['지금']; }
    if (said['도는 중'] !== undefined) {
      el('dot').classList.toggle('on', !!said['도는 중']);
      el('start').disabled = !!said['도는 중'];
    }
  }

  /**
   * Draw the seed words, marking the ones added in this session.
   *
   * @param {string[]} words - Every seed word in the file.
   * @returns {void}
   */
  function drawSeeds(words) {
    var chips = el('chips');
    chips.innerHTML = '';
    el('seed-n').textContent = words.length + '낱말';
    words.forEach(function (word) {
      var chip = document.createElement('span');
      chip.textContent = word;
      if (fresh[word]) { chip.className = 'new'; }
      chips.appendChild(chip);
    });
  }

  /**
   * The three-column browser over the store.
   *
   * @returns {object} Its loader, so the tab switch can fill it on first sight.
   */
  var finder = (function () {
    var artists = el('artists');
    var songs = el('songs');
    var lines = el('lines');
    var typing = null;

    /**
     * Turn milliseconds into the `분:초.십분의일` a person reads against a player.
     *
     * @param {number} ms - A time in milliseconds.
     * @returns {string} The same time as `1:04.2`.
     */
    function clock(ms) {
      var whole = Math.max(0, ms) / 1000;
      var min = Math.floor(whole / 60);
      var sec = (whole - min * 60).toFixed(1);
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /**
     * Fill one column with rows.
     *
     * @param {HTMLElement} where - The column body.
     * @param {Array} rows - What to show.
     * @param {Function} make - Turns one row into `{name, mark, faint, full}`.
     * @param {Function} pick - Called with the row when it is chosen.
     * @returns {void}
     */
    function fill(where, rows, make, pick) {
      where.innerHTML = '';
      if (!rows.length) {
        where.innerHTML = '<p class="empty">없음</p>';
        return;
      }
      rows.forEach(function (row) {
        var shown = make(row);
        var item = document.createElement('div');
        item.className = 'row' + (shown.faint ? ' faint' : '');
        item.setAttribute('role', 'option');
        item.innerHTML = '<span class="name"></span><span class="mark"></span>';
        item.firstChild.textContent = shown.name;
        item.lastChild.textContent = shown.mark;
        item.title = shown.full || shown.name;
        item.addEventListener('click', function () {
          Array.prototype.forEach.call(where.children, function (other) {
            other.setAttribute('aria-selected', 'false');
          });
          item.setAttribute('aria-selected', 'true');
          pick(row);
        });
        where.appendChild(item);
      });
    }

    /**
     * Load the artist column, honouring the search box.
     *
     * @returns {void}
     */
    function loadArtists() {
      fetch('/api/artists?limit=500&q=' + encodeURIComponent(el('find').value.trim()))
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          fill(artists, rows, function (row) {
            return {
              name: row['이름'],
              mark: row['시각 있는 곡'] + '/' + row['곡'],
              faint: !row['시각 있는 곡']
            };
          }, loadSongs);
        });
    }

    /**
     * Load every song the chosen artist is credited on.
     *
     * @param {object} artist - The row from the artist column.
     * @returns {void}
     */
    function loadSongs(artist) {
      el('head-artist').textContent = artist['이름'];
      el('tail-artist').textContent = '';
      fetch('/api/tracks?limit=500&artist_id=' + artist['번호'])
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          el('tail-artist').textContent = rows.length + '곡';
          fill(songs, rows, function (row) {
            return {
              name: row['제목'],
              full: row['제목'] + ' — ' + row['아티스트'],
              mark: row['상태'] === 'synced' ? row['줄'] + '줄'
                : (row['상태'] === 'new' ? '아직' : '시각 없음'),
              faint: row['상태'] !== 'synced'
            };
          }, loadLines);
        });
    }

    /**
     * Load one song's timed lines.
     *
     * @param {object} row - The song row from the middle column.
     * @returns {void}
     */
    function loadLines(row) {
      el('head-song').textContent = row['제목'];
      el('tail-song').textContent = '';
      fetch('/api/track/' + row['번호']).then(function (answer) { return answer.json(); })
        .then(function (song) {
          var got = song['줄'] || [];
          el('head-song').textContent = song['제목'] || '';
          el('head-song').title = (song['제목'] || '') + ' — ' + (song['아티스트'] || '');
          el('tail-song').textContent = got.length + '줄 · ' + Math.round(song['길이'] || 0) + '초';
          lines.innerHTML = '';
          if (!got.length) {
            lines.innerHTML = '<p class="empty">' +
              (song['상태'] === 'new' ? '아직 안 받은 곡' : '줄 시각이 없는 곡') + '</p>';
            return;
          }
          got.forEach(function (one) {
            var line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = '<em></em><span></span>';
            line.firstChild.textContent = clock(one.at);
            line.lastChild.textContent = one.text;
            lines.appendChild(line);
          });
        });
    }

    el('find').addEventListener('input', function () {
      window.clearTimeout(typing);
      typing = window.setTimeout(loadArtists, 220);
    });

    return { load: loadArtists };
  })();

  /**
   * Switch between the log and the browser.
   *
   * @param {string} which - "log" or "files".
   * @returns {void}
   */
  function show(which) {
    var onFiles = which === 'files';
    el('view-files').hidden = !onFiles;
    el('view-log').hidden = onFiles;
    el('tab-files').setAttribute('aria-selected', onFiles ? 'true' : 'false');
    el('tab-log').setAttribute('aria-selected', onFiles ? 'false' : 'true');
    if (onFiles && !el('artists').childNodes.length) { finder.load(); }
  }
  el('tab-log').addEventListener('click', function () { show('log'); });
  el('tab-files').addEventListener('click', function () { show('files'); });

  el('start').addEventListener('click', function () {
    fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    say('note', '— 시작 —');
  });
  el('stop').addEventListener('click', function () {
    fetch('/api/stop', { method: 'POST' });
    say('note', '— 멈추는 중 —');
  });
  el('add').addEventListener('click', function () {
    var box = el('seed');
    var asked = box.value.trim();
    if (!asked) { return; }
    box.value = '';
    fetch('/api/seed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '낱말': asked })
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      (said['넣음'] || []).forEach(function (word) { fresh[word] = true; });
      if (!(said['넣음'] || []).length) {
        say('note', '이미 있는 씨앗: ' + (said['이미 있음'] || []).join(', '));
      }
      return fetch('/api/state');
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      drawSeeds(said['씨앗'] || []);
    });
  });
  el('seed').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { el('add').click(); }
  });

  fetch('/api/state').then(function (answer) { return answer.json(); }).then(function (said) {
    tally(said);
    drawSeeds(said['씨앗'] || []);
    (said['지난 줄'] || []).forEach(function (one) { say(one.kind, one.line); });
    if (!(said['지난 줄'] || []).length) { say('note', '시작을 누르면 여기에 걸음이 흐른다.'); }
  });

  var wire = new EventSource('/stream');
  wire.onmessage = function (event) {
    var said = JSON.parse(event.data);
    if (said.line) { say(said.kind, said.line); }
    if (said.kind === 'count' || said.kind === 'state') { tally(said); }
  };
  wire.onerror = function () { el('doing').textContent = '서버와 끊김 · 다시 잇는 중'; };
})();
</script>
</body>
</html>
