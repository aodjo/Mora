<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수확이 번지는 것</title>
<style>
  :root {
    --ground: #0d1412;
    --panel: #131c19;
    --line: #223029;
    --ink: #e6eeea;
    --muted: #8fa09a;
    --seed: #e0a458;
    --walked: #5cc6a6;
    --waiting: #4a6d63;
    --lyric: #8fd0ff;
    --mono: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, monospace;
    --body: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body);
    display: grid; grid-template-columns: 1fr 340px; grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: auto 50vh auto; } }

  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .now { font-family: var(--mono); font-size: 12.5px; color: var(--muted); flex: 1 1 200px; }
  header .now b { color: var(--walked); font-weight: 500; }
  .tallies { display: flex; gap: 18px; flex-wrap: wrap; }
  .tally { display: flex; align-items: baseline; gap: 6px; }
  .tally span { font-size: 11.5px; color: var(--muted); }
  .tally b { font-family: var(--mono); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }

  main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .legend {
    position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--muted); background: rgba(13,20,18,.72); padding: 7px 10px; border-radius: 2px;
  }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 860px) { aside { border-left: 0; border-top: 1px solid var(--line); } }
  .box { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .box h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
  .knobs { display: flex; gap: 6px; }
  button, input {
    font-family: var(--body); font-size: 13.5px; color: var(--ink);
    background: #18231f; border: 1px solid var(--line); border-radius: 2px; padding: 8px 11px;
  }
  button { cursor: pointer; }
  button.go { background: var(--walked); border-color: var(--walked); color: #06100d; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  input { flex: 1; min-width: 0; }
  input::placeholder { color: #5e6f69; }
  .feed { flex: 1; overflow-y: auto; padding: 6px 0 20px; min-height: 0; }
  .feed div {
    display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 5px 14px;
    font-size: 12.5px; line-height: 1.45; border-bottom: 1px solid rgba(34,48,41,.5);
  }
  .feed em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 1px; }
  .feed b { font-weight: 500; }
  .feed .t-seed b { color: var(--seed); }
  .feed .t-artist b { color: var(--walked); }
  .feed .t-lyric b { color: var(--lyric); }
  .feed .t-lyric.no b { color: var(--muted); }
  .feed small { color: var(--muted); display: block; }
  .hint { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>수확이 번지는 것</h1>
  <p class="now" id="now">멈춰 있음</p>
  <div class="tallies">
    <div class="tally"><span>시각 있는 곡</span><b id="t-song">0</b></div>
    <div class="tally"><span>줄</span><b id="t-line">0</b></div>
    <div class="tally"><span>아티스트</span><b id="t-artist">0</b></div>
    <div class="tally"><span>남은</span><b id="t-left">0</b></div>
    <div class="tally"><span>받을 곡</span><b id="t-wait">0</b></div>
  </div>
</header>

<main>
  <canvas id="sky"></canvas>
  <div class="legend">
    <span><i style="background:var(--seed)"></i>씨앗 낱말</span>
    <span><i style="background:var(--walked)"></i>훑은 아티스트</span>
    <span><i style="background:var(--waiting)"></i>줄 선 아티스트</span>
    <span>선 = 다리가 된 곡</span>
  </div>
</main>

<aside>
  <div class="box">
    <h2>움직임</h2>
    <div class="knobs">
      <button class="go" id="fresh" type="button">처음부터</button>
      <button id="start" type="button">이어서</button>
      <button id="stop" type="button">멈춤</button>
    </div>
    <p class="hint" id="book">처음부터: 빈 장부에 씨앗부터 다시 번진다. 이어서: 모아 둔 vibe.db 를 마저 채운다.</p>
  </div>
  <div class="box">
    <h2>씨앗 더 넣기</h2>
    <div class="knobs">
      <input id="seed" type="text" placeholder="잔나비, 검정치마" autocomplete="off">
      <button id="add" type="button">넣기</button>
    </div>
    <p class="hint">넣으면 바로 검색해서 그 자리에 새 점으로 뜬다.</p>
  </div>
  <h2 class="box" style="border-bottom:0;padding-bottom:0">흐름</h2>
  <div class="feed" id="feed"></div>
</aside>

<script>
/**
 * The crawl drawn as a growing graph.
 *
 * Nodes are artists, edges are the track that carried the crawl from one to the next. Seeds sit
 * where their search put them; everyone else is born beside whoever found them and is pushed
 * apart by a plain repulsion so the shape spreads instead of piling on one spot.
 */
(function () {
  var sky = document.getElementById('sky');
  var pen = sky.getContext('2d');
  var nodes = [];            /** All artists on screen, newest last. */
  var byId = new Map();      /** artistId → node. */
  var edges = [];            /** {a, b, why} pairs, where `why` is the track that bridged them. */
  var LIMIT = 900;           /** Stop adding nodes past this; the shape is made by then. */
  var hue = { seed: '#e0a458', walked: '#5cc6a6', waiting: '#4a6d63' };

  /**
   * Fit the canvas to its box in device pixels.
   *
   * @returns {void}
   */
  function fit() {
    var box = sky.getBoundingClientRect();
    var ratio = window.devicePixelRatio || 1;
    sky.width = Math.max(320, box.width) * ratio;
    sky.height = Math.max(240, box.height) * ratio;
    pen.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener('resize', fit);

  /**
   * Add an artist to the graph, or return the one already there.
   *
   * @param {number} id - The artist's Vibe id.
   * @param {string} name - Their name.
   * @param {object|null} from - The node that found them, or null for a seed.
   * @param {string} kind - "seed" or "artist".
   * @param {string} why - The track that bridged them, when there was one.
   * @returns {object|null} The node, or null when the graph is full.
   */
  function put(id, name, from, kind, why) {
    var had = byId.get(id);
    if (had) { return had; }
    if (nodes.length >= LIMIT) { return null; }
    var box = sky.getBoundingClientRect();
    var angle = Math.random() * Math.PI * 2;
    var near = from || { x: box.width / 2, y: box.height / 2 };
    var one = {
      id: id, name: name || '', kind: kind, tracks: 0, sync: 0, born: performance.now(),
      x: near.x + Math.cos(angle) * (from ? 34 : 120),
      y: near.y + Math.sin(angle) * (from ? 34 : 120),
      vx: 0, vy: 0
    };
    nodes.push(one);
    byId.set(id, one);
    if (from) { edges.push({ a: from, b: one, why: why || '' }); }
    return one;
  }

  /**
   * Push nodes apart, pull edges together, and keep everything inside the frame.
   *
   * Repulsion runs against a capped slice of neighbours rather than every pair, which keeps the
   * cost flat as the graph grows past a few hundred points.
   *
   * @returns {void}
   */
  function settle() {
    var box = sky.getBoundingClientRect();
    var mid = { x: box.width / 2, y: box.height / 2 };
    var count = nodes.length;
    for (var i = 0; i < count; i++) {
      var one = nodes[i];
      var step = Math.max(1, Math.floor(count / 220));
      for (var j = i + 1; j < count; j += step) {
        var two = nodes[j];
        var dx = one.x - two.x, dy = one.y - two.y;
        var far = dx * dx + dy * dy;
        if (far > 26000 || far === 0) { continue; }
        var push = 280 / (far + 40);
        one.vx += dx * push; one.vy += dy * push;
        two.vx -= dx * push; two.vy -= dy * push;
      }
      one.vx += (mid.x - one.x) * 0.0012;
      one.vy += (mid.y - one.y) * 0.0012;
    }
    for (var e = 0; e < edges.length; e++) {
      var a = edges[e].a, b = edges[e].b;
      var ex = b.x - a.x, ey = b.y - a.y;
      var len = Math.sqrt(ex * ex + ey * ey) || 1;
      var pull = (len - 62) * 0.012;
      a.vx += ex / len * pull; a.vy += ey / len * pull;
      b.vx -= ex / len * pull; b.vy -= ey / len * pull;
    }
    for (var k = 0; k < count; k++) {
      var it = nodes[k];
      it.vx *= 0.86; it.vy *= 0.86;
      it.x = Math.min(box.width - 12, Math.max(12, it.x + it.vx));
      it.y = Math.min(box.height - 12, Math.max(12, it.y + it.vy));
    }
  }

  /**
   * Draw one frame: edges first, then artists, then names for the ones worth naming.
   *
   * @returns {void}
   */
  function draw() {
    var box = sky.getBoundingClientRect();
    pen.clearRect(0, 0, box.width, box.height);
    pen.lineWidth = 1;
    pen.strokeStyle = 'rgba(92,198,166,0.20)';
    pen.beginPath();
    for (var e = 0; e < edges.length; e++) {
      pen.moveTo(edges[e].a.x, edges[e].a.y);
      pen.lineTo(edges[e].b.x, edges[e].b.y);
    }
    pen.stroke();

    var now = performance.now();
    for (var i = 0; i < nodes.length; i++) {
      var one = nodes[i];
      var size = one.kind === 'seed' ? 6 : 3 + Math.min(7, Math.sqrt(one.tracks) * 0.7);
      var fresh = now - one.born;
      if (fresh < 900) {
        pen.beginPath();
        pen.arc(one.x, one.y, size + (1 - fresh / 900) * 16, 0, Math.PI * 2);
        pen.fillStyle = 'rgba(92,198,166,' + (0.18 * (1 - fresh / 900)) + ')';
        pen.fill();
      }
      pen.beginPath();
      pen.arc(one.x, one.y, size, 0, Math.PI * 2);
      pen.fillStyle = one.kind === 'seed' ? hue.seed : (one.tracks ? hue.walked : hue.waiting);
      pen.fill();
      if (one.kind === 'seed' || one.tracks >= 40) {
        pen.font = '11px -apple-system, system-ui, sans-serif';
        pen.fillStyle = one.kind === 'seed' ? 'rgba(224,164,88,.95)' : 'rgba(230,238,234,.78)';
        pen.fillText(one.name.slice(0, 12), one.x + size + 4, one.y + 4);
      }
    }
  }

  /**
   * Keep the picture moving.
   *
   * @returns {void}
   */
  function tick() { settle(); draw(); requestAnimationFrame(tick); }

  var feed = document.getElementById('feed');

  /**
   * Put one line in the side feed, keeping it short.
   *
   * @param {string} kind - Which class of step, for colour.
   * @param {string} left - The small mono label.
   * @param {string} body - The HTML body of the line.
   * @returns {void}
   */
  function say(kind, left, body) {
    var row = document.createElement('div');
    row.className = 't-' + kind;
    row.innerHTML = '<em>' + left + '</em><span>' + body + '</span>';
    feed.insertBefore(row, feed.firstChild);
    while (feed.childNodes.length > 120) { feed.removeChild(feed.lastChild); }
  }

  /**
   * Escape text coming from the API before it goes into the feed.
   *
   * @param {string} raw - Song or artist name.
   * @returns {string} The same text, safe as HTML.
   */
  function safe(raw) {
    return String(raw || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var counters = {
    song: document.getElementById('t-song'), line: document.getElementById('t-line'),
    artist: document.getElementById('t-artist'), left: document.getElementById('t-left'),
    wait: document.getElementById('t-wait'), now: document.getElementById('now')
  };

  /**
   * Handle one step from the server.
   *
   * @param {object} step - The event as `harvest_web.py` pushed it.
   * @returns {void}
   */
  function step(one) {
    if (one.kind === 'seed') {
      var seed = put('씨앗:' + one.word, one.word, null, 'seed', '');
      (one.artists || []).forEach(function (who) { put(who.id, who.name, seed, 'artist', ''); });
      say('seed', '씨앗', '<b>' + safe(one.word) + '</b> → 아티스트 ' + (one.artists || []).length + ' 명');
    } else if (one.kind === 'walk') {
      counters.now.innerHTML = '<b>' + safe(one.name) + '</b> 의 곡 목록을 받는 중';
    } else if (one.kind === 'artist') {
      var from = byId.get(one.id) || put(one.id, one.name, null, 'artist', '');
      if (from) { from.tracks += one.tracks; from.sync += one.sync || 0; }
      (one.found || []).forEach(function (who) { put(who.id, who.name, from, 'artist', who.by); });
      say('artist', '훑음', '<b>' + safe(one.name) + '</b> · 곡 ' + one.tracks +
        ' · 새 아티스트 ' + (one.found || []).length +
        ((one.found || [])[0] ? '<small>다리: ' + safe((one.found[0].by || '').slice(0, 28)) +
          ' → ' + safe(one.found[0].name) + '</small>' : ''));
    } else if (one.kind === 'lyric') {
      if (one.ok) {
        say('lyric', one.lines + '줄', '<b>' + safe(one.title) + '</b> <small>' + safe(one.artist) +
          (one.first ? ' · ' + safe(one.first.slice(0, 24)) : '') + '</small>');
      }
    } else if (one.kind === 'count' || one.kind === 'state') {
      if (one['곡'] !== undefined) { counters.song.textContent = one['곡'].toLocaleString('ko-KR'); }
      if (one['줄'] !== undefined) { counters.line.textContent = one['줄'].toLocaleString('ko-KR'); }
      if (one['아티스트'] !== undefined) { counters.artist.textContent = one['아티스트'].toLocaleString('ko-KR'); }
      if (one['남은 아티스트'] !== undefined) { counters.left.textContent = one['남은 아티스트'].toLocaleString('ko-KR'); }
      if (one['받을 곡'] !== undefined) { counters.wait.textContent = one['받을 곡'].toLocaleString('ko-KR'); }
      if (one.kind === 'state' && one['지금']) { counters.now.textContent = one['지금']; }
    }
  }

  /**
   * Ask the server to start, either on the real store or on an empty one.
   *
   * @param {boolean} afresh - True to wipe the watching store and spread from the seeds again.
   * @returns {void}
   */
  function begin(afresh) {
    if (afresh) { wipe(); }
    fetch('/api/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '처음부터': !!afresh })
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      document.getElementById('book').textContent = '장부: ' + said['장부'];
      if (!said['시작']) { counters.now.textContent = '이미 도는 중'; }
    });
    counters.now.textContent = afresh ? '빈 장부에서 다시 시작' : '이어서 시작';
  }

  /**
   * Clear the drawing so a fresh run starts from an empty sky.
   *
   * @returns {void}
   */
  function wipe() {
    nodes.length = 0; edges.length = 0; byId.clear();
    feed.innerHTML = '';
  }

  document.getElementById('fresh').addEventListener('click', function () { begin(true); });
  document.getElementById('start').addEventListener('click', function () { begin(false); });
  document.getElementById('stop').addEventListener('click', function () {
    fetch('/api/stop', { method: 'POST' });
  });
  document.getElementById('add').addEventListener('click', function () {
    var box = document.getElementById('seed');
    if (!box.value.trim()) { return; }
    fetch('/api/seed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '낱말': box.value })
    });
    box.value = '';
  });
  document.getElementById('seed').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { document.getElementById('add').click(); }
  });

  /**
   * Draw what the store already walked, so a reloaded page does not start on an empty sky.
   *
   * Seeds come back as a word on each artist they turned up, so the seed dots are rebuilt from
   * those words; everyone else hangs off whoever found them.
   *
   * @returns {void}
   */
  function replay() {
    fetch('/api/graph').then(function (answer) { return answer.json(); }).then(function (said) {
      document.getElementById('book').textContent = '장부: ' + said['장부'];
      var waiting = (said['점'] || []).slice();
      var left = waiting.length + 1;
      while (waiting.length && left-- > 0) {
        var rest = [];
        waiting.forEach(function (one) {
          var from = one.from ? byId.get(one.from) : null;
          if (one.from && !from) { rest.push(one); return; }
          if (!from && one.seed) { from = put('씨앗:' + one.seed, one.seed, null, 'seed', ''); }
          var made = put(one.id, one.name, from, 'artist', one.by);
          if (made) { made.tracks = one.tracks || 0; made.born = 0; }
        });
        if (rest.length === waiting.length) { break; }
        waiting = rest;
      }
    });
  }

  var wire = new EventSource('/stream');
  wire.onmessage = function (event) {
    var said = JSON.parse(event.data);
    if (said.kind === 'wipe') { wipe(); return; }
    step(said);
  };

  fit();
  replay();
  tick();
})();
</script>
</body>
</html>
