<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수확 지켜보기</title>
<style>
  :root {
    --ground: #0e1411;
    --panel: #141d19;
    --line: #243029;
    --ink: #e7efea;
    --muted: #8ea099;
    --seed: #e0a458;
    --walk: #5cc6a6;
    --lyric: #8fc7f0;
    --warn: #dd8a5c;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --body: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body);
    display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;
  }
  [hidden] { display: none !important; }

  header { border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 11px 16px; }
  .bar h1 { font-size: 14.5px; font-weight: 600; margin: 0; }
  .state { font-family: var(--mono); font-size: 12.5px; color: var(--muted); flex: 1 1 180px; }
  .state b { color: var(--walk); font-weight: 500; }
  .knobs { display: flex; gap: 6px; }
  button, input {
    font-family: var(--body); font-size: 13.5px; color: var(--ink);
    background: #18231f; border: 1px solid var(--line); border-radius: 2px; padding: 7px 12px;
  }
  button { cursor: pointer; }
  button.go { background: var(--walk); border-color: var(--walk); color: #06100d; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--walk); outline-offset: 1px; }

  .tallies { display: flex; gap: 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .tallies div { flex: 1 1 120px; padding: 9px 16px 11px; border-right: 1px solid var(--line); }
  .tallies div:last-child { border-right: 0; }
  .tallies span { display: block; font-size: 11.5px; color: var(--muted); }
  .tallies b { font-family: var(--mono); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

  .log { overflow-y: auto; padding: 10px 0 40px; font-family: var(--mono); font-size: 12.5px; line-height: 1.62; }
  .log p { margin: 0; padding: 1px 16px; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  .log p.k-seed { color: var(--seed); }
  .log p.k-artist { color: var(--walk); }
  .log p.k-lyric { color: var(--ink); }
  .log p.k-note { color: var(--warn); }
  .log p:hover { background: rgba(92,198,166,.06); }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 820px) { aside { border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; } }
  .box { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .box h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
  .row { display: flex; gap: 6px; }
  .row input { flex: 1; min-width: 0; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .seeds { overflow-y: auto; padding: 10px 14px 24px; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; min-height: 0; }
  .seeds span {
    font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--muted); background: #18231f;
  }
  .seeds span.new { color: var(--seed); border-color: var(--seed); }

  button.view { padding: 6px 12px; font-size: 13px; }
  button.view.on { background: #22302b; border-color: var(--walk); color: var(--ink); }

  #files { min-height: 0; }
  .finder { display: grid; grid-template-columns: 260px 300px 1fr; height: 100%; min-height: 0; }
  @media (max-width: 900px) { .finder { grid-template-columns: 1fr 1fr; } .finder .wide { grid-column: 1 / -1; } }
  .finder .pane { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .finder .pane:last-child { border-right: 0; }
  .pane-top {
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pane-top input { width: 100%; padding: 5px 9px; font-size: 13px; }
  .pane-top b { color: var(--ink); font-weight: 500; }
  .list { overflow-y: auto; min-height: 0; padding-bottom: 30px; }
  .list .item {
    display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; cursor: pointer;
    font-size: 13px; border-bottom: 1px solid rgba(36,48,41,.55);
  }
  .list .item:hover { background: rgba(92,198,166,.07); }
  .list .item.on { background: rgba(92,198,166,.14); }
  .list .item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .item .side { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .list .item.none .name { color: var(--muted); }
  .list .empty { padding: 14px 12px; font-size: 12.5px; color: var(--muted); }
  .lines .line { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 3px 14px; font-size: 13.5px; }
  .lines .line em {
    font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums; padding-top: 2px;
  }
  .lines .line:hover { background: rgba(92,198,166,.06); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>바이브 수확</h1>
    <div class="knobs" role="tablist" aria-label="보기">
      <button id="view-log" type="button" role="tab" aria-selected="true" class="view on">로그</button>
      <button id="view-files" type="button" role="tab" aria-selected="false" class="view">자료</button>
    </div>
    <p class="state" id="state">멈춰 있음</p>
    <div class="knobs">
      <button class="go" id="start" type="button">시작</button>
      <button id="stop" type="button">멈춤</button>
    </div>
  </div>
  <div class="tallies">
    <div><span>시각 있는 곡</span><b id="t-song">0</b></div>
    <div><span>가사 줄</span><b id="t-line">0</b></div>
    <div><span>아티스트</span><b id="t-artist">0</b></div>
    <div><span>아직 안 훑음</span><b id="t-left">0</b></div>
    <div><span>받을 곡</span><b id="t-wait">0</b></div>
  </div>
</header>

<section id="files" hidden>
  <div class="finder">
    <div class="pane">
      <div class="pane-top">
        <input id="find" type="search" placeholder="아티스트 · 곡 찾기" autocomplete="off">
      </div>
      <div class="list" id="artists"></div>
    </div>
    <div class="pane">
      <div class="pane-top"><span id="pane-artist">아티스트를 고르세요</span></div>
      <div class="list" id="songs"></div>
    </div>
    <div class="pane wide">
      <div class="pane-top"><span id="pane-song">곡을 고르면 줄 시각이 여기 나옵니다</span></div>
      <div class="list lines" id="lines"></div>
    </div>
  </div>
</section>

<main id="console">
  <div class="log" id="log"></div>
  <aside>
    <div class="box">
      <h2>씨앗 넣기</h2>
      <div class="row">
        <input id="seed" type="text" placeholder="잔나비, 검정치마" autocomplete="off">
        <button id="add" type="button">넣기</button>
      </div>
      <p class="hint">넣으면 바로 검색해서 아티스트를 줄에 세우고, seeds.txt 에도 적힌다.</p>
    </div>
    <div class="box" style="border-bottom:0;padding-bottom:4px">
      <h2>지금 씨앗 <span id="seed-n" style="color:var(--muted)"></span></h2>
    </div>
    <div class="seeds" id="seeds"></div>
  </aside>
</main>

<script>
/**
 * The harvest console: a live log, the running totals, and a box for new seed words.
 */
(function () {
  var log = document.getElementById('log');
  var seeds = document.getElementById('seeds');
  var counters = {
    song: document.getElementById('t-song'), line: document.getElementById('t-line'),
    artist: document.getElementById('t-artist'), left: document.getElementById('t-left'),
    wait: document.getElementById('t-wait'), state: document.getElementById('state')
  };
  var fresh = {};

  /**
   * Put one line at the bottom of the log, following it when the reader is already at the bottom.
   *
   * Following only when already at the bottom is what lets someone scroll up and read without the
   * stream yanking them back down.
   *
   * @param {string} kind - "seed", "artist", "lyric" or "note", for colour.
   * @param {string} text - The line itself.
   * @returns {void}
   */
  function say(kind, text) {
    var glued = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    var row = document.createElement('p');
    row.className = 'k-' + kind;
    row.textContent = text;
    log.appendChild(row);
    while (log.childNodes.length > 1200) { log.removeChild(log.firstChild); }
    if (glued) { log.scrollTop = log.scrollHeight; }
  }

  /**
   * Write the totals into the header.
   *
   * @param {object} said - A state or count step.
   * @returns {void}
   */
  function tally(said) {
    var pairs = [['곡', counters.song], ['줄', counters.line], ['아티스트', counters.artist],
                 ['남은 아티스트', counters.left], ['받을 곡', counters.wait]];
    pairs.forEach(function (pair) {
      if (said[pair[0]] !== undefined) { pair[1].textContent = Number(said[pair[0]]).toLocaleString('ko-KR'); }
    });
    if (said['지금']) {
      counters.state.innerHTML = said['도는 중'] === false ? said['지금'] : '<b>' + said['지금'] + '</b>';
    }
    if (said['도는 중'] !== undefined) {
      document.getElementById('start').disabled = !!said['도는 중'];
    }
  }

  /**
   * Draw the seed words, marking the ones added in this session.
   *
   * @param {string[]} words - Every seed word in the file.
   * @returns {void}
   */
  function drawSeeds(words) {
    seeds.innerHTML = '';
    document.getElementById('seed-n').textContent = words.length + ' 낱말';
    words.forEach(function (word) {
      var chip = document.createElement('span');
      chip.textContent = word;
      if (fresh[word]) { chip.className = 'new'; }
      seeds.appendChild(chip);
    });
  }

  fetch('/api/state').then(function (answer) { return answer.json(); }).then(function (said) {
    tally(said);
    drawSeeds(said['씨앗'] || []);
    (said['지난 줄'] || []).forEach(function (one) { say(one.kind, one.line); });
    if (!(said['지난 줄'] || []).length) { say('note', '시작을 누르면 여기에 걸음이 흐른다.'); }
  });

  document.getElementById('start').addEventListener('click', function () {
    fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    say('note', '— 시작 —');
  });
  document.getElementById('stop').addEventListener('click', function () {
    fetch('/api/stop', { method: 'POST' });
    say('note', '— 멈추는 중 —');
  });

  document.getElementById('add').addEventListener('click', function () {
    var box = document.getElementById('seed');
    var asked = box.value.trim();
    if (!asked) { return; }
    box.value = '';
    fetch('/api/seed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '낱말': asked })
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      (said['넣음'] || []).forEach(function (word) { fresh[word] = true; });
      if (!(said['넣음'] || []).length) {
        say('note', '이미 있는 씨앗: ' + (said['이미 있음'] || []).join(', '));
      }
      return fetch('/api/state');
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      drawSeeds(said['씨앗'] || []);
    });
  });
  document.getElementById('seed').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { document.getElementById('add').click(); }
  });

  var wire = new EventSource('/stream');
  wire.onmessage = function (event) {
    var said = JSON.parse(event.data);
    if (said.line) { say(said.kind, said.line); }
    if (said.kind === 'count' || said.kind === 'state') { tally(said); }
  };
  wire.onerror = function () { counters.state.textContent = '서버와 끊김 · 다시 잇는 중'; };

  /**
   * The browsing view: artists, their songs, and one song's timed lines.
   *
   * Three columns that fill left to right, the way a file manager does — the choice in one column
   * decides what the next one holds, and nothing reloads the page.
   */
  var finder = (function () {
    var artists = document.getElementById('artists');
    var songs = document.getElementById('songs');
    var lines = document.getElementById('lines');
    var topArtist = document.getElementById('pane-artist');
    var topSong = document.getElementById('pane-song');
    var find = document.getElementById('find');
    var chosen = { artist: null, song: null };

    /**
     * Turn milliseconds into the `분:초.십분의일` a person reads against a player.
     *
     * @param {number} ms - A time in milliseconds.
     * @returns {string} The same time as `1:04.2`.
     */
    function clock(ms) {
      var whole = Math.max(0, ms) / 1000;
      var min = Math.floor(whole / 60);
      var sec = (whole - min * 60).toFixed(1);
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /**
     * Fill a column with rows, each one clickable.
     *
     * @param {HTMLElement} where - The column to fill.
     * @param {Array} rows - What to show.
     * @param {Function} make - Turns one row into `{name, side, dim}`.
     * @param {Function} pick - Called with the row when it is clicked.
     * @returns {void}
     */
    function fill(where, rows, make, pick) {
      where.innerHTML = '';
      if (!rows.length) {
        var none = document.createElement('p');
        none.className = 'empty';
        none.textContent = '없음';
        where.appendChild(none);
        return;
      }
      rows.forEach(function (row) {
        var shown = make(row);
        var item = document.createElement('div');
        item.className = 'item' + (shown.dim ? ' none' : '');
        item.innerHTML = '<span class="name"></span><span class="side"></span>';
        item.firstChild.textContent = shown.name;
        item.lastChild.textContent = shown.side;
        item.addEventListener('click', function () {
          Array.prototype.forEach.call(where.children, function (other) { other.classList.remove('on'); });
          item.classList.add('on');
          pick(row);
        });
        where.appendChild(item);
      });
    }

    /**
     * Load the artist column, honouring whatever is typed in the search box.
     *
     * @returns {void}
     */
    function loadArtists() {
      var q = find.value.trim();
      fetch('/api/artists?limit=400&q=' + encodeURIComponent(q))
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          fill(artists, rows, function (row) {
            return {
              name: row['이름'],
              side: row['시각 있는 곡'] + '/' + row['곡'],
              dim: !row['시각 있는 곡']
            };
          }, function (row) { loadSongs(row['이름']); });
          if (q && rows.length) { loadSongs(rows[0]['이름']); }
        });
    }

    /**
     * Load one artist's songs.
     *
     * @param {string} name - Whose songs.
     * @returns {void}
     */
    function loadSongs(name) {
      chosen.artist = name;
      topArtist.innerHTML = '<b></b>';
      topArtist.firstChild.textContent = name;
      fetch('/api/tracks?limit=500&artist=' + encodeURIComponent(name))
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          topArtist.innerHTML = '<b></b> · 곡 ' + rows.length;
          topArtist.firstChild.textContent = name;
          fill(songs, rows, function (row) {
            return {
              name: row['제목'],
              side: row['상태'] === 'synced' ? row['줄'] + '줄' : (row['상태'] === 'new' ? '아직' : '시각 없음'),
              dim: row['상태'] !== 'synced'
            };
          }, function (row) { loadLines(row); });
        });
    }

    /**
     * Load one song's lines into the right column.
     *
     * @param {object} row - The song row from the middle column.
     * @returns {void}
     */
    function loadLines(row) {
      chosen.song = row['번호'];
      fetch('/api/track/' + row['번호']).then(function (answer) { return answer.json(); })
        .then(function (song) {
          topSong.innerHTML = '<b></b> · ' + (song['줄'] || []).length + '줄 · ' +
            Math.round(song['길이'] || 0) + '초';
          topSong.firstChild.textContent = song['제목'] || '';
          lines.innerHTML = '';
          if (!(song['줄'] || []).length) {
            lines.innerHTML = '<p class="empty">' +
              (song['상태'] === 'new' ? '아직 안 받은 곡' : '줄 시각이 없는 곡') + '</p>';
            return;
          }
          song['줄'].forEach(function (one) {
            var line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = '<em></em><span></span>';
            line.firstChild.textContent = clock(one.at);
            line.lastChild.textContent = one.text;
            lines.appendChild(line);
          });
        });
    }

    var typing = null;
    find.addEventListener('input', function () {
      window.clearTimeout(typing);
      typing = window.setTimeout(loadArtists, 220);
    });

    return { load: loadArtists };
  })();

  var views = {
    log: document.getElementById('view-log'), files: document.getElementById('view-files'),
    console: document.getElementById('console'), pane: document.getElementById('files')
  };

  /**
   * Switch between the running log and the browsing view.
   *
   * @param {string} which - "log" or "files".
   * @returns {void}
   */
  function show(which) {
    var onFiles = which === 'files';
    views.console.hidden = onFiles;
    views.pane.hidden = !onFiles;
    views.files.classList.toggle('on', onFiles);
    views.log.classList.toggle('on', !onFiles);
    views.files.setAttribute('aria-selected', onFiles ? 'true' : 'false');
    views.log.setAttribute('aria-selected', onFiles ? 'false' : 'true');
    if (onFiles) { finder.load(); }
  }
  views.log.addEventListener('click', function () { show('log'); });
  views.files.addEventListener('click', function () { show('files'); });
})();
</script>
</body>
</html>
