<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수확 지켜보기</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0d1211;
    --panel: #121918;
    --raise: #182120;
    --line: #202b28;
    --ink: #e8efec;
    --mid: #9aaaa4;
    --dim: #6c7d77;
    --go: #4fc3a1;
    --seed: #dda85c;
    --lyric: #8ec5ea;
    --stop: #d2694a;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --body: "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 13px;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 머리띠 하나에 다 넣는다. 큰 숫자 판은 화면을 절반이나 먹었다. ── */
  .bar {
    display: flex; align-items: center; gap: 14px; padding: 0 12px; height: 42px; flex: 0 0 42px;
    border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow: hidden;
  }
  .brand { font-weight: 600; letter-spacing: -0.01em; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .tabs button {
    font: inherit; color: var(--mid); background: none; border: 0; padding: 5px 12px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { background: var(--raise); color: var(--ink); }
  .stats { display: flex; gap: 12px; align-items: baseline; overflow: hidden; }
  .stats i { font-style: normal; color: var(--dim); margin-right: 4px; }
  .stats b { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .grow { flex: 1 1 auto; min-width: 8px; }
  .doing { color: var(--mid); display: flex; align-items: center; gap: 6px; min-width: 0; }
  .doing span { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 7px; }
  .dot.on { background: var(--go); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
  .act { display: flex; gap: 6px; }
  button.push {
    font: inherit; color: var(--ink); background: var(--raise); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 12px; cursor: pointer;
  }
  button.push.main { background: var(--go); border-color: var(--go); color: #06100d; font-weight: 600; }
  button.push:disabled { opacity: .4; cursor: default; }
  button.push.tiny { padding: 2px 8px; font-size: 11.5px; flex: 0 0 auto; }
  button.push.switch[aria-pressed="true"] { border-color: var(--go); color: var(--go); }
  button.push.switch[aria-pressed="false"] { border-color: var(--seed); color: var(--seed); }
  .row .wait { color: var(--seed); }

  /* ── 음원 ── */
  .audio { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); width: 100%; min-height: 0; }
  @media (max-width: 1000px) {
    .audio { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .adetail { border-left: 0; border-top: 1px solid var(--line); }
  }
  .arow > div { min-width: 0; }
  .alist:focus { outline: none; }
  .alist:focus-visible { outline: 1px solid var(--go); outline-offset: -1px; }
  .alist .more { margin: 10px 12px 24px; }
  .verdict { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; color: var(--mid); font-size: 12.5px; }
  .verdict .badge { padding: 2px 8px; }
  .busy { margin: 0; color: var(--seed); font-size: 12.5px; }
  .say button:disabled { cursor: default; opacity: .6; }
  .adetail .put input { font: inherit; }
  .apanel { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .actl, .afilter {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .actl label { color: var(--mid); display: flex; align-items: center; gap: 5px; }
  .actl input[type="number"] {
    width: 74px; font: inherit; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 7px;
  }
  .actl .check input { accent-color: var(--go); }
  .aprog { flex: 1 1 120px; height: 6px; background: var(--raise); border-radius: 3px; overflow: hidden; min-width: 80px; }
  .aprog i { display: block; height: 100%; width: 0; background: var(--go); transition: width .3s; }
  .aprog-t { font-family: var(--mono); font-size: 12px; color: var(--mid); }
  .states { display: flex; gap: 4px; flex-wrap: wrap; }
  .states button {
    font: inherit; font-size: 12px; color: var(--mid); background: var(--raise);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer;
  }
  .states button[aria-selected="true"] { color: var(--ink); border-color: var(--go); }
  .states button b { font-family: var(--mono); font-weight: 500; margin-left: 4px; }
  .afilter input[type="search"] {
    font: inherit; flex: 1 1 160px; min-width: 120px; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px;
  }
  .adisk { color: var(--dim); font-family: var(--mono); font-size: 12px; }
  .adisk.low { color: var(--seed); }
  .alist { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .arow {
    display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center;
    padding: 6px 12px; border-bottom: 1px solid rgba(32,43,40,.55); cursor: pointer;
  }
  .arow:hover { background: rgba(79,195,161,.06); }
  .arow[aria-selected="true"] { background: rgba(79,195,161,.14); }
  .arow .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .sub { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .num { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--mid); white-space: nowrap; }
  .arow .num small { color: var(--dim); }
  .badge { font-size: 11px; text-align: center; padding: 2px 0; border-radius: 3px; border: 1px solid var(--line); color: var(--mid); }
  .s-got { color: var(--go); border-color: var(--go); }
  .s-picked { color: var(--lyric); border-color: var(--lyric); }
  .s-suspect { color: var(--seed); border-color: var(--seed); }
  .s-miss { color: var(--dim); }
  .s-fail, .s-wrong { color: var(--stop); border-color: var(--stop); }
  .adetail { border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; padding: 14px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  .adetail h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .adetail h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .adetail .meta { color: var(--mid); font-size: 12.5px; margin: 3px 0 0; }
  /* 관리자 화면처럼: 썸네일로 있다가 누르면 플레이어가 된다. 작은 채로는 스크러버가 몇 픽셀이라 커진다. */
  .yt-thumb {
    position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 3px; background: var(--raise); cursor: pointer;
  }
  .yt-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .yt-thumb span {
    position: absolute; inset: 0; display: grid; place-items: center; color: #fff;
    background: rgb(0 0 0 / .3); transition: background .15s;
  }
  .yt-thumb:hover span { background: rgb(0 0 0 / .12); }
  .yt-frame {
    display: block; width: 100%; max-width: 640px; aspect-ratio: 16 / 9;
    border: 1px solid var(--line); border-radius: 3px; background: #000;
  }
  .video { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 12px; align-items: start; }
  .video.playing { grid-template-columns: minmax(0, 1fr); }
  .video .vi { min-width: 0; }
  .video a { color: var(--lyric); text-decoration: none; }
  .video a:hover { text-decoration: underline; }
  .video .vt { font-weight: 500; overflow-wrap: anywhere; }
  .video .vm { color: var(--mid); font-size: 12.5px; margin-top: 4px; }
  .adetail > * { flex-shrink: 0; }
  .adetail audio { width: 100%; }
  .say { display: flex; flex-direction: column; }
  .say button {
    display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; text-align: left;
    font: inherit; color: var(--ink); background: none; border: 0; padding: 3px 4px; cursor: pointer; border-radius: 3px;
  }
  .say button:hover { background: rgba(79,195,161,.08); }
  .say button em { font-style: normal; font-family: var(--mono); font-size: 11.5px; color: var(--dim); padding-top: 1px; }
  .cands { display: flex; flex-direction: column; font-size: 12.5px; }
  .cand {
    display: grid; grid-template-columns: 104px minmax(0, 1fr) auto auto auto; gap: 8px 10px;
    align-items: start; padding: 7px 6px; border-bottom: 1px solid rgba(32,43,40,.6);
  }
  .cand.on { background: rgba(79,195,161,.1); }
  .cand.playing > .yt { grid-column: 1 / -1; }
  .cand.playing > .ci { grid-column: 1 / span 2; }
  .cand .ci { min-width: 0; overflow-wrap: anywhere; }
  .cand .n { font-family: var(--mono); color: var(--mid); white-space: pre; text-align: right; }
  .cand .why { color: var(--dim); font-size: 11.5px; }
  .cand a { color: var(--lyric); text-decoration: none; }
  .cand a:hover { text-decoration: underline; }
  @media (max-width: 520px) {
    .cand { grid-template-columns: 88px minmax(0, 1fr) auto; }
    .cand .cd { grid-column: 2 / -1; }
  }
  .deeds { display: flex; gap: 6px; flex-wrap: wrap; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--go); outline-offset: 1px; }

  main { flex: 1 1 auto; min-height: 0; display: flex; }

  /* ── 자료: 세 칸 ── */
  .cols { display: grid; grid-template-columns: 240px 320px minmax(0, 1fr); width: 100%; min-height: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } .cols .col:nth-child(3) { grid-column: 1 / -1; } }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }
  .col > header {
    flex: 0 0 auto; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
    color: var(--mid); font-size: 12px; display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .col > header b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col > header .tail { color: var(--dim); flex: 0 0 auto; }
  .col > header input {
    font: inherit; width: 100%; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px;
  }
  .col .body { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  .row {
    display: flex; align-items: baseline; gap: 8px; padding: 4px 10px; cursor: pointer;
    border-bottom: 1px solid rgba(32,43,40,.5);
  }
  .row:hover { background: rgba(79,195,161,.07); }
  .row[aria-selected="true"] { background: rgba(79,195,161,.15); }
  .row .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .mark { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .row.faint .name { color: var(--dim); }
  .empty { padding: 12px 10px; color: var(--dim); }

  .line { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; padding: 2px 12px; }
  .line em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .line span { overflow-wrap: anywhere; }
  .line:hover { background: rgba(79,195,161,.06); }

  /* ── 로그 ── */
  .logwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; width: 100%; min-height: 0; }
  @media (max-width: 900px) { .logwrap { grid-template-columns: 1fr; } }
  .log { overflow-y: auto; min-height: 0; padding: 6px 0 24px; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
  .log p { margin: 0; padding: 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--mid); }
  .log p.k-seed { color: var(--seed); }
  .log p.k-artist { color: var(--go); }
  .log p.k-lyric { color: var(--ink); }
  .log p.k-note { color: var(--stop); }
  .rail { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  @media (max-width: 900px) { .rail { border-left: 0; border-top: 1px solid var(--line); max-height: 40vh; } }
  .rail section { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
  .rail h2 { margin: 0; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .put { display: flex; gap: 6px; }
  .put input {
    font: inherit; flex: 1 1 auto; min-width: 0; color: var(--ink); background: var(--raise);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px;
  }
  .rail p.hint { margin: 0; color: var(--dim); font-size: 12px; }
  .chips { overflow-y: auto; min-height: 0; padding: 10px 12px 20px; display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .chips span { font-size: 11.5px; padding: 2px 7px; border: 1px solid var(--line); border-radius: 999px; color: var(--mid); }
  .chips span.new { color: var(--seed); border-color: var(--seed); }
</style>
</head>
<body>
<div class="bar">
  <span class="brand">바이브 수확</span>
  <nav class="tabs" role="tablist" aria-label="보기">
    <button id="tab-log" role="tab" aria-selected="true" type="button">로그</button>
    <button id="tab-files" role="tab" aria-selected="false" type="button">자료</button>
    <button id="tab-audio" role="tab" aria-selected="false" type="button">음원</button>
  </nav>
  <div class="stats">
    <span><i>곡</i><b id="n-song">0</b></span>
    <span><i>줄</i><b id="n-line">0</b></span>
    <span><i>아티스트</i><b id="n-artist">0</b></span>
    <span><i>안 훑음</i><b id="n-left">0</b></span>
    <span><i>받을 곡</i><b id="n-wait">0</b></span>
    <span><i>접은 중복</i><b id="n-dup">0</b></span>
    <span title="성인 인증 등으로 가사를 안 주는 곡(403). 곡 하나만 막힌 것이라 속도는 안 늦춘다."><i>막힌 곡</i><b id="n-barred">0</b></span>
    <span title="바이브가 전체를 막은 횟수(429·503, 또는 403 이 성공 없이 12번 잇달음). 그때만 쉼을 늘린다."><i>차단</i><b id="n-block">0</b></span>
  </div>
  <span class="grow"></span>
  <span class="doing"><i class="dot" id="dot"></i><span id="doing">멈춰 있음</span></span>
  <div class="act">
    <button class="push switch" id="walking" type="button" aria-pressed="true"
            title="끄면 가사만 받는다. 찾은 아티스트는 기다렸다가 다시 켜면 훑는다.">아티스트 훑기 켬</button>
    <button class="push main" id="start" type="button">시작</button>
    <button class="push" id="stop" type="button">멈춤</button>
  </div>
</div>

<main>
  <div class="logwrap" id="view-log">
    <div class="log" id="log"></div>
    <div class="rail">
      <section>
        <h2>씨앗 넣기</h2>
        <div class="put">
          <input id="seed" type="text" placeholder="잔나비, 검정치마" autocomplete="off">
          <button class="push" id="add" type="button">넣기</button>
        </div>
        <p class="hint">넣으면 바로 검색하고 seeds.txt 에도 적힌다.</p>
      </section>
      <section>
        <h2>막힌 곡 <span id="barred-n" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h2>
        <div class="put">
          <button class="push" id="recheck" type="button"
                  title="예전에 403 도 「시각 없음」으로 적혔다. 다시 받아서 막힌 곡과 진짜 없는 곡을 가른다.">시각 없음 다시 보기</button>
          <button class="push" id="login-pass" type="button"
                  title="막힌 곡의 가사를 로그인 세션으로 받는다. 두 곡씩 천천히.">로그인으로 받기</button>
        </div>
        <p class="hint" id="login-hint">로그인 세션이 있어야 한다.</p>
      </section>
      <section style="border-bottom:0;padding-bottom:2px">
        <h2>지금 씨앗 <span id="seed-n" style="color:var(--dim);text-transform:none;letter-spacing:0"></span></h2>
      </section>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <div class="audio" id="view-audio" hidden>
    <div class="apanel">
      <div class="actl">
        <label>곡 <input id="a-limit" type="number" min="1" max="100000" value="100"></label>
        <label>동시 <input id="a-hands" type="number" min="1" max="8" value="3"></label>
        <label class="check"><input id="a-dry" type="checkbox"> 고르기만</label>
        <button class="push main" id="a-start" type="button">받기 시작</button>
        <button class="push" id="a-stop" type="button">멈춤</button>
        <div class="aprog" title="이번 판 진행"><i id="a-bar"></i></div>
        <span class="aprog-t" id="a-prog">쉬는 중</span>
      </div>
      <div class="afilter">
        <div class="states" id="a-states" role="tablist" aria-label="상태로 거르기"></div>
        <input id="a-find" type="search" placeholder="가수 · 제목 찾기" autocomplete="off">
        <span class="adisk" id="a-disk"></span>
      </div>
      <div class="alist" id="a-list" tabindex="0" role="listbox" aria-label="곡 · ↑↓ 로 옮기고 스페이스로 듣는다"></div>
    </div>
    <div class="adetail" id="a-detail">
      <p class="empty">왼쪽에서 곡을 고르면 어느 영상을 왜 골랐는지, 다른 후보는 뭐였는지가 여기 나온다.
        목록에서 ↑↓ 로 옮기고 스페이스로 듣는다.</p>
    </div>
  </div>

  <div class="cols" id="view-files" hidden>
    <div class="col">
      <header><input id="find" type="search" placeholder="아티스트 찾기" autocomplete="off"></header>
      <div class="body" id="artists"></div>
    </div>
    <div class="col">
      <header>
        <b id="head-artist">아티스트</b><span class="tail" id="tail-artist"></span>
        <span class="grow"></span>
        <button class="push tiny" id="walk" type="button" hidden>먼저 훑기</button>
      </header>
      <div class="body" id="songs"></div>
    </div>
    <div class="col">
      <header><b id="head-song">곡</b><span class="tail" id="tail-song"></span></header>
      <div class="body" id="lines"></div>
    </div>
  </div>
</main>

<script>
/**
 * The harvest console: a running log with a seed box, and a three-column browser over what has
 * been collected.
 */
(function () {
  var el = function (id) { return document.getElementById(id); };
  var log = el('log');
  var fresh = {};

  /**
   * Put one line at the bottom of the log, following it only when the reader is already there.
   *
   * @param {string} kind - "seed", "artist", "lyric" or "note", for colour.
   * @param {string} text - The line itself.
   * @returns {void}
   */
  function say(kind, text) {
    var glued = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    var row = document.createElement('p');
    row.className = 'k-' + kind;
    row.textContent = text;
    log.appendChild(row);
    while (log.childNodes.length > 1500) { log.removeChild(log.firstChild); }
    if (glued) { log.scrollTop = log.scrollHeight; }
  }

  /**
   * Write the totals and the running state into the bar.
   *
   * @param {object} said - A state or count step.
   * @returns {void}
   */
  function tally(said) {
    [['곡', 'n-song'], ['줄', 'n-line'], ['아티스트', 'n-artist'],
     ['남은 아티스트', 'n-left'], ['받을 곡', 'n-wait'], ['같은 곡', 'n-dup'],
     ['막힌 곡', 'n-barred'], ['막힘', 'n-block']].forEach(function (pair) {
      if (said[pair[0]] !== undefined) {
        el(pair[1]).textContent = Number(said[pair[0]]).toLocaleString('ko-KR');
      }
    });
    if (said['지금']) { el('doing').textContent = said['지금']; }
    if (said['도는 중'] !== undefined) {
      el('dot').classList.toggle('on', !!said['도는 중']);
      el('start').disabled = !!said['도는 중'];
    }
    if (said['훑기'] !== undefined) { drawWalking(!!said['훑기']); }
  }

  /**
   * Show the walking switch in its current position.
   *
   * @param {boolean} on - Whether artists are being walked.
   * @returns {void}
   */
  function drawWalking(on) {
    var knob = el('walking');
    knob.setAttribute('aria-pressed', on ? 'true' : 'false');
    knob.textContent = on ? '아티스트 훑기 켬' : '아티스트 훑기 끔 · 가사만';
  }

  /**
   * Draw the seed words, marking the ones added in this session.
   *
   * @param {string[]} words - Every seed word in the file.
   * @returns {void}
   */
  function drawSeeds(words) {
    var chips = el('chips');
    chips.innerHTML = '';
    el('seed-n').textContent = words.length + '낱말';
    words.forEach(function (word) {
      var chip = document.createElement('span');
      chip.textContent = word;
      if (fresh[word]) { chip.className = 'new'; }
      chips.appendChild(chip);
    });
  }

  /**
   * The three-column browser over the store.
   *
   * @returns {object} Its loader, so the tab switch can fill it on first sight.
   */
  var finder = (function () {
    var artists = el('artists');
    var songs = el('songs');
    var lines = el('lines');
    var typing = null;

    /**
     * Turn milliseconds into the `분:초.십분의일` a person reads against a player.
     *
     * @param {number} ms - A time in milliseconds.
     * @returns {string} The same time as `1:04.2`.
     */
    function clock(ms) {
      var whole = Math.max(0, ms) / 1000;
      var min = Math.floor(whole / 60);
      var sec = (whole - min * 60).toFixed(1);
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /**
     * Fill one column with rows.
     *
     * @param {HTMLElement} where - The column body.
     * @param {Array} rows - What to show.
     * @param {Function} make - Turns one row into `{name, mark, faint, full}`.
     * @param {Function} pick - Called with the row when it is chosen.
     * @returns {void}
     */
    function fill(where, rows, make, pick) {
      where.innerHTML = '';
      if (!rows.length) {
        where.innerHTML = '<p class="empty">없음</p>';
        return;
      }
      rows.forEach(function (row) {
        var shown = make(row);
        var item = document.createElement('div');
        item.className = 'row' + (shown.faint ? ' faint' : '');
        item.setAttribute('role', 'option');
        item.innerHTML = '<span class="name"></span><span class="mark"></span>';
        item.firstChild.textContent = shown.name;
        item.lastChild.textContent = shown.mark;
        item.title = shown.full || shown.name;
        item.addEventListener('click', function () {
          Array.prototype.forEach.call(where.children, function (other) {
            other.setAttribute('aria-selected', 'false');
          });
          item.setAttribute('aria-selected', 'true');
          pick(row);
        });
        where.appendChild(item);
      });
    }

    /**
     * Load the artist column, honouring the search box.
     *
     * @returns {void}
     */
    function loadArtists() {
      fetch('/api/artists?limit=500&q=' + encodeURIComponent(el('find').value.trim()))
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          fill(artists, rows, function (row) {
            return {
              name: row['이름'],
              full: row['이름'] + (row['훑음'] ? '' : '\n아직 안 훑은 아티스트 — 곡 목록을 받지 않았다'),
              mark: row['훑음'] ? row['시각 있는 곡'] + '/' + row['곡'] : '안 훑음',
              faint: !row['시각 있는 곡']
            };
          }, loadSongs);
        });
    }

    /**
     * Load every song the chosen artist is credited on.
     *
     * @param {object} artist - The row from the artist column.
     * @returns {void}
     */
    function loadSongs(artist) {
      el('head-artist').textContent = artist['이름'];
      el('tail-artist').textContent = '';
      var walk = el('walk');
      walk.hidden = false;
      walk.disabled = false;
      walk.textContent = artist['훑음'] ? '다시 훑기' : '먼저 훑기';
      walk.onclick = function () {
        walk.disabled = true;
        walk.textContent = '차례 올림';
        fetch('/api/walk', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ '번호': artist['번호'] })
        });
      };
      fetch('/api/tracks?limit=500&artist_id=' + artist['번호'])
        .then(function (answer) { return answer.json(); })
        .then(function (rows) {
          el('tail-artist').textContent = rows.length + '곡' +
            (artist['훑음'] ? '' : ' · 아직 안 훑음');
          fill(songs, rows, function (row) {
            var copies = (row['벌'] || 1) > 1 ? ' ×' + row['벌'] : '';
            return {
              name: row['제목'],
              full: row['제목'] + ' — ' + row['아티스트'] + '\n' + (row['앨범'] || '') +
                (copies ? '\n같은 곡 ' + row['벌'] + '벌 (앨범마다 따로 실린 것)' : ''),
              mark: (row['상태'] === 'synced' ? row['줄'] + '줄'
                : (row['상태'] === 'new' ? '아직' : '시각 없음')) + copies,
              faint: row['상태'] !== 'synced'
            };
          }, loadLines);
        });
    }

    /**
     * Load one song's timed lines.
     *
     * @param {object} row - The song row from the middle column.
     * @returns {void}
     */
    function loadLines(row) {
      el('head-song').textContent = row['제목'];
      el('tail-song').textContent = '';
      fetch('/api/track/' + row['번호']).then(function (answer) { return answer.json(); })
        .then(function (song) {
          var got = song['줄'] || [];
          el('head-song').textContent = song['제목'] || '';
          el('head-song').title = (song['제목'] || '') + ' — ' + (song['아티스트'] || '');
          el('tail-song').textContent = got.length + '줄 · ' + Math.round(song['길이'] || 0) + '초';
          lines.innerHTML = '';
          if (!got.length) {
            lines.innerHTML = '<p class="empty">' +
              (song['상태'] === 'new' ? '아직 안 받은 곡' : '줄 시각이 없는 곡') + '</p>';
            return;
          }
          got.forEach(function (one) {
            var line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = '<em></em><span></span>';
            line.firstChild.textContent = clock(one.at);
            line.lastChild.textContent = one.text;
            lines.appendChild(line);
          });
        });
    }

    el('find').addEventListener('input', function () {
      window.clearTimeout(typing);
      typing = window.setTimeout(loadArtists, 220);
    });

    return { load: loadArtists };
  })();

  /**
   * The audio dashboard: which YouTube upload each song was matched to, why, and how it sounds.
   *
   * @returns {object} `load` to fill it on first sight, `hear` for stream steps, and `poll` for
   *   records written by a terminal run the server cannot see.
   */
  var tuner = (function () {
    var NAMES = { got: '받음', picked: '고름', suspect: '의심', miss: '못 찾음', fail: '실패', wrong: '틀림' }; /** How each record state reads on the page. */
    var ORDER = ['got', 'picked', 'suspect', 'miss', 'fail', 'wrong']; /** The order the state filters appear in. */
    var PAGE = 300; /** How many rows one list request brings. */
    var list = el('a-list');
    var detail = el('a-detail');
    var only = '';
    var open = null;
    var shown = 0;
    var counts = {};
    var asked = 0;
    var typing = null;
    var summing = null;
    var loaded = false;
    var pending = {};
    var note = '';

    /**
     * Read a response body as JSON.
     *
     * @param {Response} answer - What `fetch` resolved with.
     * @returns {Promise<object>} The parsed body.
     */
    function json(answer) { return answer.json(); }

    /**
     * Send a JSON body and read the JSON answer.
     *
     * @param {string} path - Where to post.
     * @param {object} [body={}] - What to send.
     * @returns {Promise<object>} The parsed answer.
     */
    function post(path, body) {
      return fetch(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
      }).then(json);
    }

    /**
     * Turn seconds into `분:초`.
     *
     * @param {number} seconds - A length in seconds.
     * @returns {string} The same length as `3:25`, or a dash when unknown.
     */
    function mmss(seconds) {
      if (!seconds) { return '—'; }
      var whole = Math.round(seconds);
      var sec = whole % 60;
      return Math.floor(whole / 60) + ':' + (sec < 10 ? '0' : '') + sec;
    }

    /**
     * Turn a lyric line's start into `분:초.십분의일`, the way the lyric browser shows it.
     *
     * @param {number} ms - A time in milliseconds.
     * @returns {string} The same time as `1:04.2`.
     */
    function stamp(ms) {
      var tenths = Math.floor(Math.max(0, ms) / 100);
      var min = Math.floor(tenths / 600);
      var sec = (tenths - min * 600) / 10;
      return min + ':' + (sec < 10 ? '0' : '') + sec.toFixed(1);
    }

    /**
     * Say how far one length is from the length Vibe gives.
     *
     * @param {number} got - The upload's or the file's length in seconds.
     * @param {number} want - Vibe's length in seconds.
     * @returns {string} A signed gap such as `+1.2초`, or an empty string when either is missing.
     */
    function off(got, want) {
      if (!got || !want) { return ''; }
      var gap = got - want;
      return (gap >= 0 ? '+' : '−') + Math.abs(gap).toFixed(1) + '초';
    }

    /**
     * Turn a byte count into the unit a person reads.
     *
     * @param {number} bytes - A size in bytes.
     * @returns {string} The same size as `1.4 GB`.
     */
    function size(bytes) {
      var units = ['B', 'KB', 'MB', 'GB', 'TB'];
      var at = 0;
      while (bytes >= 1024 && at < units.length - 1) { bytes /= 1024; at += 1; }
      return (at ? bytes.toFixed(1) : bytes) + ' ' + units[at];
    }

    /**
     * Pull a YouTube video id out of whatever a person pasted.
     *
     * @param {string} text - A watch URL, a youtu.be link, a shorts link, or a bare id.
     * @returns {string} The 11-character id, or an empty string when none is found.
     */
    function videoOf(text) {
      var found = /(?:v=|youtu\.be\/|shorts\/|embed\/)([A-Za-z0-9_-]{11})/.exec(text) ||
        /^\s*([A-Za-z0-9_-]{11})\s*$/.exec(text);
      return found ? found[1] : '';
    }

    /**
     * Draw the batch in flight: the bar, the count per state, and the start button.
     *
     * @param {object} run - `{도는 중, total, done, dry, tally}` from the server.
     * @returns {void}
     */
    function drawRun(run) {
      if (!run) { return; }
      var going = !!run['도는 중'];
      var total = run.total || 0;
      var done = run.done || 0;
      var tally = run.tally || {};
      el('a-bar').style.width = total ? Math.min(100, done / total * 100) + '%' : '0';
      el('a-start').disabled = going;
      var word = going ? (run.dry ? '고르는 중 ' : '받는 중 ')
        : (!total ? '쉬는 중' : (done < total ? '멈춤 ' : '끝남 '));
      var parts = ORDER.filter(function (key) { return tally[key]; })
        .map(function (key) { return NAMES[key] + ' ' + tally[key]; });
      el('a-prog').textContent = word + (total ? done + '/' + total : '') +
        (parts.length ? ' · ' + parts.join(' · ') : '') + (note ? ' · ' + note : '');
    }

    /**
     * Draw the state filters with how many songs sit in each.
     *
     * @returns {void}
     */
    function drawStates() {
      var box = el('a-states');
      var all = ORDER.reduce(function (sum, key) { return sum + (counts[key] || 0); }, 0);
      box.innerHTML = '';
      [''].concat(ORDER).forEach(function (key) {
        var pill = document.createElement('button');
        pill.type = 'button';
        pill.setAttribute('role', 'tab');
        pill.setAttribute('aria-selected', key === only ? 'true' : 'false');
        pill.innerHTML = '<span></span><b></b>';
        pill.firstChild.textContent = key ? NAMES[key] : '전체';
        pill.lastChild.textContent = Number(key ? counts[key] || 0 : all).toLocaleString('ko-KR');
        if (key) { pill.lastChild.className = 's-' + key; }
        pill.addEventListener('click', function () {
          only = key;
          drawStates();
          loadList(false);
        });
        box.appendChild(pill);
      });
    }

    /**
     * Load the counts, the disk use and the batch state.
     *
     * @returns {void}
     */
    function loadSummary() {
      fetch('/api/audio/summary').then(json).then(function (said) {
        counts = said['상태별'] || {};
        drawStates();
        var free = said['남은 곳'];
        el('a-disk').textContent = '음원 ' + size(said['디스크'] || 0) +
          (free !== undefined ? ' · 남은 디스크 ' + Math.round(free) + ' GB' : '');
        el('a-disk').title = '남은 디스크가 ' + (said['바닥선'] || 40) + ' GB 밑으로 내려가면 받기를 스스로 멈춘다';
        el('a-disk').classList.toggle('low', free !== undefined && free < (said['바닥선'] || 40) + 20);
        drawRun(said['판']);
      });
    }

    /**
     * Load the counts again soon, at most once every second and a half.
     *
     * @returns {void}
     */
    function soonSummary() {
      if (summing) { return; }
      summing = window.setTimeout(function () { summing = null; loadSummary(); }, 1500);
    }

    /**
     * Turn one list row into its element.
     *
     * @param {object} row - A row from `/api/audio/list`, or one made from a stream step.
     * @returns {HTMLElement} The row, wired to open the song on click.
     */
    function rowOf(row) {
      var item = document.createElement('div');
      item.className = 'arow';
      item.setAttribute('role', 'option');
      item.dataset.id = row['번호'];
      item.setAttribute('aria-selected', String(row['번호']) === String(open) ? 'true' : 'false');
      item.innerHTML = '<span class="badge"></span><div><div class="name"></div><div class="sub"></div></div>' +
        '<div class="num"></div>';
      item.children[0].className = 'badge s-' + row['상태'];
      item.children[0].textContent = NAMES[row['상태']] || row['상태'];
      item.querySelector('.name').textContent = row['제목'] + ' — ' + row['가수'];
      item.querySelector('.sub').textContent = row['영상']
        ? (row['사람이 고름'] ? '손으로 고름 · ' : '') + (row['영상 제목'] || row['영상']) + ' · ' + row['채널']
        : (row['까닭'] || '길이가 맞는 영상이 없다');
      var num = item.querySelector('.num');
      num.textContent = off(row['파일 길이'] || row['영상 길이'], row['바이브 길이']) || '—';
      if (row['점수'] !== null && row['점수'] !== undefined) {
        var mark = document.createElement('small');
        mark.textContent = ' ' + Math.round(row['점수']) + '점';
        num.appendChild(mark);
      }
      item.title = row['제목'] + ' — ' + row['가수'] + '\n' + (row['영상 제목'] || '') +
        (row['까닭'] ? '\n' + row['까닭'] : '');
      item.addEventListener('click', function () {
        select(item);
        list.focus({ preventScroll: true });
      });
      return item;
    }

    /**
     * Mark one row as chosen and open its song.
     *
     * @param {HTMLElement} item - The row.
     * @returns {void}
     */
    function select(item) {
      Array.prototype.forEach.call(list.querySelectorAll('.arow'), function (other) {
        other.setAttribute('aria-selected', other === item ? 'true' : 'false');
      });
      open = item.dataset.id;
      item.scrollIntoView({ block: 'nearest' });
      loadOne(open);
    }

    /**
     * Load the list for the current filter and search, or the next page of it.
     *
     * @param {boolean} more - Append the next page instead of starting over.
     * @returns {void}
     */
    function loadList(more) {
      var ticket = ++asked;
      var word = el('a-find').value.trim();
      fetch('/api/audio/list?limit=' + PAGE + '&offset=' + (more ? shown : 0) + '&state=' + only +
            '&q=' + encodeURIComponent(word))
        .then(json).then(function (rows) {
          if (ticket !== asked) { return; }
          loaded = true;
          if (!more) { list.innerHTML = ''; shown = 0; }
          var tail = list.querySelector('.more');
          if (tail) { list.removeChild(tail); }
          if (!rows.length && !shown) {
            list.innerHTML = '<p class="empty">' + (only || word ? '맞는 곡 없음'
              : '아직 기록이 없다. 시작을 누르면 고른 곡이 여기에 쌓인다.') + '</p>';
            return;
          }
          rows.forEach(function (row) { list.appendChild(rowOf(row)); });
          shown += rows.length;
          if (rows.length === PAGE) {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'push more';
            button.textContent = '더 보기';
            button.addEventListener('click', function () { loadList(true); });
            list.appendChild(button);
          }
        });
    }

    /**
     * Load one song in full and draw it on the right.
     *
     * @param {string|number} id - The track id.
     * @returns {void}
     */
    function loadOne(id) {
      fetch('/api/audio/one/' + id).then(json).then(function (song) {
        if (String(id) === String(open)) { drawOne(song); }
      });
    }

    /**
     * Ask the server to fetch a given upload for a song, and hold the pane until it lands.
     *
     * @param {number} id - The track id.
     * @param {string} video - The upload to fetch.
     * @returns {void}
     */
    function fetchVideo(id, video) {
      pending[id] = video;
      post('/api/audio/choose', { '번호': id, '영상': video });
      loadOne(id);
    }

    /**
     * Change a song's record: `wrong` keeps it but marks the pick as wrong, `again` forgets it so
     * the next batch searches it afresh.
     *
     * @param {number} id - The track id.
     * @param {string} state - "wrong" or "again".
     * @returns {void}
     */
    function mark(id, state) {
      post('/api/audio/mark', { '번호': id, '상태': state }).then(function () {
        var item = list.querySelector('.arow[data-id="' + id + '"]');
        if (state === 'again') {
          if (item) { list.removeChild(item); }
          detail.innerHTML = '<p class="empty">기록을 지웠다. 다음 판에서 이 곡을 처음부터 다시 찾는다.</p>';
        } else {
          if (item) { item.children[0].className = 'badge s-wrong'; item.children[0].textContent = NAMES.wrong; }
          loadOne(id);
        }
        loadSummary();
      });
    }

    /**
     * Make a small labelled section for the detail pane.
     *
     * @param {string} label - The section heading.
     * @returns {HTMLElement} The section, with its heading already in place.
     */
    function part(label) {
      var box = document.createElement('section');
      var head = document.createElement('h3');
      head.textContent = label;
      box.appendChild(head);
      detail.appendChild(box);
      return box;
    }

    /**
     * Make a YouTube thumbnail that turns into a player when pressed, the way the admin shows
     * uploads.
     *
     * At thumbnail size YouTube's own controls are unusable, so the one that plays grows to the
     * width of its row. Only one plays at a time — see `hush`.
     *
     * @param {string} video - The upload's id.
     * @param {string} title - What to call it for screen readers.
     * @returns {HTMLElement} The holder, carrying its thumbnail for folding back.
     */
    function tube(video, title) {
      var holder = document.createElement('div');
      holder.className = 'yt';
      holder.dataset.video = video;
      holder.dataset.title = title;
      var thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'yt-thumb';
      thumb.setAttribute('aria-label', title + ' 재생');
      thumb.innerHTML = '<img alt="" loading="lazy"><span><svg viewBox="0 0 16 16" width="18" height="18" ' +
        'aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" fill="currentColor"/></svg></span>';
      thumb.firstChild.src = 'https://i.ytimg.com/vi/' + encodeURIComponent(video) + '/mqdefault.jpg';
      thumb.addEventListener('click', function () { playTube(holder, 0); });
      holder.appendChild(thumb);
      holder.thumb = thumb;
      return holder;
    }

    /**
     * Start one YouTube player, from a given second, folding every other source away first.
     *
     * @param {HTMLElement} holder - A holder from `tube`.
     * @param {number} start - Where to start, in seconds.
     * @returns {void}
     */
    function playTube(holder, start) {
      hush(holder);
      var frame = document.createElement('iframe');
      frame.className = 'yt-frame';
      frame.title = holder.dataset.title;
      frame.allow = 'autoplay; encrypted-media; picture-in-picture';
      frame.allowFullscreen = true;
      frame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(holder.dataset.video) +
        '?autoplay=1&rel=0' + (start > 0 ? '&start=' + Math.floor(start) : '');
      holder.innerHTML = '';
      holder.appendChild(frame);
      holder.classList.add('on');
      if (holder.parentNode) { holder.parentNode.classList.add('playing'); }
    }

    /**
     * Put a playing YouTube player back to its thumbnail, which also stops it.
     *
     * @param {HTMLElement} holder - A holder from `tube`.
     * @returns {void}
     */
    function fold(holder) {
      if (!holder.classList.contains('on')) { return; }
      holder.innerHTML = '';
      holder.appendChild(holder.thumb);
      holder.classList.remove('on');
      if (holder.parentNode) { holder.parentNode.classList.remove('playing'); }
    }

    /**
     * Keep to one sound at a time: fold every YouTube player but `keep`, and when a player is
     * starting, pause the downloaded file too.
     *
     * @param {HTMLElement|null} keep - The holder about to play, or null when the file is.
     * @returns {void}
     */
    function hush(keep) {
      Array.prototype.forEach.call(detail.querySelectorAll('.yt.on'), function (holder) {
        if (holder !== keep) { fold(holder); }
      });
      var file = detail.querySelector('audio');
      if (keep && file && !file.paused) { file.pause(); }
    }

    /**
     * Draw one song: the chosen upload, a player for the file, the first lyric lines to check by
     * ear, and every candidate with a button to take it instead.
     *
     * @param {object} song - The answer from `/api/audio/one`.
     * @returns {void}
     */
    function drawOne(song) {
      detail.innerHTML = '';
      if (song['없음']) {
        detail.innerHTML = '<p class="empty">기록이 없다 — 다시 찾기로 지운 곡일 수 있다.</p>';
        return;
      }
      var id = song['번호'];
      var video = song['영상'];
      var want = song['바이브 길이'];
      var waiting = pending[id];

      var head = document.createElement('div');
      head.innerHTML = '<h2></h2><p class="meta"></p>';
      head.firstChild.textContent = song['제목'];
      head.lastChild.textContent = [song['가수'], song['앨범'], '바이브 ' + mmss(want), '#' + id]
        .filter(Boolean).join(' · ');
      detail.appendChild(head);

      var verdict = document.createElement('div');
      verdict.className = 'verdict';
      verdict.innerHTML = '<span class="badge"></span><span></span>';
      verdict.firstChild.className = 'badge s-' + song['상태'];
      verdict.firstChild.textContent = NAMES[song['상태']] || song['상태'];
      verdict.lastChild.textContent = (song['점수'] !== null && song['점수'] !== undefined
        ? Math.round(song['점수']) + '점 · ' : '') + (song['까닭'] || (video ? '' : '길이가 맞는 영상이 없다'));
      detail.appendChild(verdict);

      if (waiting) {
        var busy = document.createElement('p');
        busy.className = 'busy';
        busy.textContent = '받는 중 · youtu.be/' + waiting + ' — 끝나면 이 칸이 바뀐다';
        detail.appendChild(busy);
      }

      var player = null;
      var stage = null;
      if (video) {
        var box = document.createElement('div');
        box.className = 'video';
        stage = tube(video, song['영상 제목'] || video);
        box.appendChild(stage);
        box.insertAdjacentHTML('beforeend', '<div class="vi"><a class="vt" target="_blank" rel="noopener"></a>' +
          '<div class="vm"></div><div class="vm"></div></div>');
        box.querySelector('.vt').href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(video);
        box.querySelector('.vt').textContent = song['영상 제목'] || video;
        var metas = box.querySelectorAll('.vm');
        metas[0].textContent = (song['채널'] || '') + ' · youtu.be/' + video;
        metas[1].textContent = '영상 ' + mmss(song['영상 길이']) + ' ' + off(song['영상 길이'], want) +
          (song['파일'] ? ' · 받은 파일 ' + mmss(song['파일 길이']) + ' ' + off(song['파일 길이'], want) : '');
        detail.appendChild(box);
      }

      if (song['파일']) {
        player = document.createElement('audio');
        player.controls = true;
        player.preload = 'metadata';
        player.src = '/media/' + id + '?at=' + encodeURIComponent(song['때'] || '');
        player.addEventListener('play', function () { hush(null); });
        detail.appendChild(player);
      }

      var deeds = document.createElement('div');
      deeds.className = 'deeds';
      if (video && !song['파일']) {
        var take = document.createElement('button');
        take.type = 'button';
        take.className = 'push main';
        take.textContent = '이 영상 받기';
        take.disabled = !!waiting;
        take.addEventListener('click', function () { fetchVideo(id, video); });
        deeds.appendChild(take);
      }
      if (video && song['상태'] !== 'wrong') {
        var wrong = document.createElement('button');
        wrong.type = 'button';
        wrong.className = 'push';
        wrong.textContent = '틀림';
        wrong.title = '고른 영상이 이 곡이 아니다. 기록은 남기고 학습에서 뺀다.';
        wrong.addEventListener('click', function () { mark(id, 'wrong'); });
        deeds.appendChild(wrong);
      }
      var again = document.createElement('button');
      again.type = 'button';
      again.className = 'push';
      again.textContent = '다시 찾기';
      again.title = '이 곡의 기록을 지워서 다음 판에서 처음부터 다시 찾게 한다.';
      again.addEventListener('click', function () { mark(id, 'again'); });
      deeds.appendChild(again);
      detail.appendChild(deeds);

      var lines = song['첫 줄'] || [];
      if (lines.length) {
        var words = part(player ? '첫 줄 · 누르면 받은 파일을 그 자리부터 듣는다'
          : '첫 줄 · 누르면 위 영상을 그 자리부터 튼다');
        var say = document.createElement('div');
        say.className = 'say';
        lines.forEach(function (one) {
          var line = document.createElement('button');
          line.type = 'button';
          line.innerHTML = '<em></em><span></span>';
          line.firstChild.textContent = stamp(one.at);
          line.lastChild.textContent = one.text;
          line.disabled = !player && !video;
          line.addEventListener('click', function () {
            if (player) {
              player.currentTime = Math.max(0, one.at / 1000 - 0.5);
              player.play();
            } else if (stage) {
              playTube(stage, one.at / 1000 - 1);
            }
          });
          say.appendChild(line);
        });
        words.appendChild(say);
      }

      var cands = song['후보'] || [];
      var others = part(cands.length ? '후보 ' + cands.length + '개 · 점수 순' : '후보 없음');
      if (cands.length) {
        var pile = document.createElement('div');
        pile.className = 'cands';
        cands.forEach(function (one) {
          var row = document.createElement('div');
          var chosen = one.id === video;
          row.className = 'cand' + (chosen ? ' on' : '');
          row.appendChild(tube(one.id, one.title || one.id));
          row.insertAdjacentHTML('beforeend', '<div class="ci"><a target="_blank" rel="noopener"></a>' +
            '<div class="why"></div></div><div class="n"></div><div class="n"></div><div class="cd"></div>');
          var anchor = row.querySelector('a');
          anchor.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(one.id);
          anchor.textContent = one.title || one.id;
          row.querySelector('.why').textContent = [one.channel, one['까닭']].filter(Boolean).join(' · ');
          var cells = row.querySelectorAll('.n');
          cells[0].textContent = mmss(one.duration) + '\n' + (off(one.duration, want) || '');
          cells[1].textContent = one['점수'] !== null && one['점수'] !== undefined ? Math.round(one['점수']) + '점' : '';
          var deed = row.querySelector('.cd');
          if (chosen && song['파일']) {
            deed.innerHTML = '<span class="why">지금 것</span>';
          } else {
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'push tiny';
            button.textContent = chosen ? '받기' : '이것으로 받기';
            button.disabled = !!waiting;
            button.addEventListener('click', function () { fetchVideo(id, one.id); });
            deed.appendChild(button);
          }
          pile.appendChild(row);
        });
        others.appendChild(pile);
      }

      var put = document.createElement('div');
      put.className = 'put';
      put.innerHTML = '<input id="a-other" type="text" autocomplete="off" placeholder="다른 유튜브 주소나 영상 번호">' +
        '<button class="push" type="button">이 영상으로 받기</button>';
      var field = put.firstChild;
      var send = put.lastChild;
      send.disabled = !!waiting;
      send.addEventListener('click', function () {
        var picked = videoOf(field.value);
        if (!picked) {
          field.value = '';
          field.placeholder = '영상 번호를 못 찾았다 — youtube.com/watch?v=… 꼴로 넣어 줘';
          return;
        }
        fetchVideo(id, picked);
      });
      field.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') { send.click(); }
      });
      others.appendChild(put);
    }

    /**
     * Turn a stream step into the same shape a list row has.
     *
     * @param {object} step - An `audio-song` step.
     * @returns {object} The row.
     */
    function rowFromStep(step) {
      var video = step.video || {};
      return {
        '번호': step.track_id, '상태': step.state, '영상': video.id || null, '영상 제목': video.title || '',
        '채널': video.channel || '', '영상 길이': video.duration || 0, '바이브 길이': step.want || 0,
        '점수': step.score, '까닭': step.why || '', '파일': !!step.file, '파일 길이': step.real || 0,
        '가수': step.artist || '', '제목': step.title || '', '사람이 고름': !!step.manual
      };
    }

    /**
     * Whether a row belongs in the list as it is filtered right now.
     *
     * @param {object} row - A list row.
     * @returns {boolean} True when it passes the state filter and the search box.
     */
    function fits(row) {
      var word = el('a-find').value.trim().toLowerCase();
      if (only && row['상태'] !== only) { return false; }
      if (!word) { return true; }
      return [row['가수'], row['제목'], row['영상 제목']].some(function (text) {
        return (text || '').toLowerCase().indexOf(word) >= 0;
      });
    }

    /**
     * Take one audio step off the stream: move the bar, and put the finished song at the top.
     *
     * @param {object} step - An `audio-start`, `audio-song` or `audio-end` step.
     * @returns {void}
     */
    function hear(step) {
      if (step.kind === 'audio-start') { note = ''; }
      if (step.kind === 'audio-full') {
        note = '남은 디스크 ' + step.free + ' GB — 바닥선 ' + step.floor + ' GB 밑이라 멈춤';
      }
      if (step.kind === 'audio-blocked') {
        note = '유튜브가 막았거나 망이 끊겨 멈춤 · 막힌 곡은 안 적어서 다음 판이 다시 한다';
        el('a-prog').title = step.why || '';
        if (step.track_id) {
          delete pending[step.track_id];
          if (String(step.track_id) === String(open)) { loadOne(open); }
        }
      }
      drawRun(step.run);
      soonSummary();
      if (step.kind !== 'audio-song' || !step.track_id) { return; }
      delete pending[step.track_id];
      if (!loaded) { return; }
      var row = rowFromStep(step);
      var old = list.querySelector('.arow[data-id="' + row['번호'] + '"]');
      if (!fits(row)) {
        if (old) { list.removeChild(old); }
      } else if (old) {
        list.replaceChild(rowOf(row), old);
      } else {
        var empty = list.querySelector('.empty');
        if (empty) { list.removeChild(empty); }
        list.insertBefore(rowOf(row), list.firstChild);
        shown += 1;
      }
      if (String(row['번호']) === String(open)) { loadOne(open); }
    }

    /**
     * Name the start button after what the batch will do, so it is not mistaken for the harvest's.
     *
     * @returns {void}
     */
    function nameStart() {
      el('a-start').textContent = el('a-dry').checked ? '고르기 시작' : '받기 시작';
    }

    /**
     * Keep the start form as the reader left it last time.
     *
     * @returns {void}
     */
    function keepForm() {
      nameStart();
      try {
        localStorage.setItem('mora-audio-form', JSON.stringify({
          limit: el('a-limit').value, hands: el('a-hands').value, dry: el('a-dry').checked
        }));
      } catch (ignored) { /* storage may be blocked */ }
    }

    try {
      var kept = JSON.parse(localStorage.getItem('mora-audio-form') || 'null');
      if (kept) {
        el('a-limit').value = kept.limit || 100;
        el('a-hands').value = kept.hands || 3;
        el('a-dry').checked = !!kept.dry;
      }
    } catch (ignored) { /* storage may be blocked */ }
    nameStart();
    ['a-limit', 'a-hands', 'a-dry'].forEach(function (id) { el(id).addEventListener('change', keepForm); });

    el('a-start').addEventListener('click', function () {
      el('a-start').disabled = true;
      post('/api/audio/start', {
        '곡': Math.max(1, Number(el('a-limit').value) || 100),
        '동시': Math.min(8, Math.max(1, Number(el('a-hands').value) || 3)),
        '고르기만': el('a-dry').checked
      }).then(function (said) {
        if (!said['시작']) { el('a-prog').textContent = '이미 도는 판이 있다'; }
      });
    });
    el('a-stop').addEventListener('click', function () {
      post('/api/audio/stop').then(function () {
        el('a-prog').textContent = '멈추는 중 · 받던 곡까지는 마친다';
      });
    });
    el('a-find').addEventListener('input', function () {
      window.clearTimeout(typing);
      typing = window.setTimeout(function () { loadList(false); }, 220);
    });
    list.addEventListener('keydown', function (event) {
      var current = list.querySelector('.arow[aria-selected="true"]');
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        var next = !current ? list.querySelector('.arow')
          : (event.key === 'ArrowDown' ? current.nextElementSibling : current.previousElementSibling);
        if (next && next.classList.contains('arow')) { select(next); }
      } else if (event.key === ' ') {
        var player = detail.querySelector('audio');
        var stage = detail.querySelector('.video .yt');
        if (player) {
          event.preventDefault();
          if (player.paused) { player.play(); } else { player.pause(); }
        } else if (stage) {
          event.preventDefault();
          if (stage.classList.contains('on')) { fold(stage); } else { playTube(stage, 0); }
        }
      }
    });

    return {
      load: function () { loadSummary(); if (!loaded) { loadList(false); } },
      hear: hear,
      poll: loadSummary
    };
  })();

  /**
   * Switch between the log, the lyric browser and the audio dashboard, and remember it in the address.
   *
   * @param {string} which - "log", "files" or "audio".
   * @returns {void}
   */
  function show(which) {
    if (['log', 'files', 'audio'].indexOf(which) < 0) { which = 'log'; }
    ['log', 'files', 'audio'].forEach(function (name) {
      el('view-' + name).hidden = name !== which;
      el('tab-' + name).setAttribute('aria-selected', name === which ? 'true' : 'false');
    });
    if (which === 'files' && !el('artists').childNodes.length) { finder.load(); }
    if (which === 'audio') { tuner.load(); }
    if (window.location.hash !== '#' + which) { window.history.replaceState(null, '', '#' + which); }
  }
  el('tab-log').addEventListener('click', function () { show('log'); });
  el('tab-files').addEventListener('click', function () { show('files'); });
  el('tab-audio').addEventListener('click', function () { show('audio'); });
  show(window.location.hash.slice(1));
  window.setInterval(function () { if (!el('view-audio').hidden) { tuner.poll(); } }, 10000);

  /**
   * Show whether a login session is saved, and where it goes when it is not.
   *
   * @param {object} said - The state from the server.
   * @returns {void}
   */
  function drawLogin(said) {
    var on = !!said['로그인'];
    el('login-pass').disabled = !on;
    el('login-hint').textContent = on
      ? '로그인 세션 있음 · 막힌 곡에만 쓴다'
      : '로그인 세션 없음 — ' + (said['쿠키 자리'] || '~/.mora/vibe_cookie') + ' 에 쿠키를 넣으면 켜진다';
    if (said['막힌 곡'] !== undefined) {
      el('barred-n').textContent = Number(said['막힌 곡']).toLocaleString('ko-KR') + '곡';
    }
  }

  el('recheck').addEventListener('click', function () {
    el('recheck').disabled = true;
    fetch('/api/recheck', { method: 'POST' }).then(function (answer) { return answer.json(); })
      .then(function (said) {
        say('note', '시각 없음 ' + Number(said['다시'] || 0).toLocaleString('ko-KR') + '곡을 다시 받는다');
        el('recheck').disabled = false;
      });
  });
  el('login-pass').addEventListener('click', function () {
    fetch('/api/login-pass', { method: 'POST' }).then(function (answer) { return answer.json(); })
      .then(function (said) {
        if (!said['시작']) { say('note', said['까닭'] || '로그인 판을 못 시작함'); }
      });
  });

  el('walking').addEventListener('click', function () {
    var on = el('walking').getAttribute('aria-pressed') !== 'true';
    drawWalking(on);
    fetch('/api/walking', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '켬': on })
    });
  });

  el('start').addEventListener('click', function () {
    fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    say('note', '— 시작 —');
  });
  el('stop').addEventListener('click', function () {
    fetch('/api/stop', { method: 'POST' });
    say('note', '— 멈추는 중 —');
  });
  el('add').addEventListener('click', function () {
    var box = el('seed');
    var asked = box.value.trim();
    if (!asked) { return; }
    box.value = '';
    fetch('/api/seed', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ '낱말': asked })
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      (said['넣음'] || []).forEach(function (word) { fresh[word] = true; });
      if (!(said['넣음'] || []).length) {
        say('note', '이미 있는 씨앗: ' + (said['이미 있음'] || []).join(', '));
      }
      return fetch('/api/state');
    }).then(function (answer) { return answer.json(); }).then(function (said) {
      drawSeeds(said['씨앗'] || []);
    });
  });
  el('seed').addEventListener('keydown', function (event) {
    if (event.key === 'Enter') { el('add').click(); }
  });

  fetch('/api/state').then(function (answer) { return answer.json(); }).then(function (said) {
    tally(said);
    drawLogin(said);
    drawSeeds(said['씨앗'] || []);
    (said['지난 줄'] || []).forEach(function (one) { say(one.kind, one.line); });
    if (!(said['지난 줄'] || []).length) { say('note', '시작을 누르면 여기에 걸음이 흐른다.'); }
  });

  var wire = new EventSource('/stream');
  wire.onmessage = function (event) {
    var said = JSON.parse(event.data);
    if (String(said.kind).indexOf('audio-') === 0) { tuner.hear(said); return; }
    if (said.line) { say(said.kind, said.line); }
    if (said.kind === 'count' || said.kind === 'state') { tally(said); }
    if (said.kind === 'count' && said['막힌 곡'] !== undefined) {
      el('barred-n').textContent = Number(said['막힌 곡']).toLocaleString('ko-KR') + '곡';
    }
  };
  wire.onerror = function () { el('doing').textContent = '서버와 끊김 · 다시 잇는 중'; };
})();
</script>
</body>
</html>
