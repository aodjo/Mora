[project]
name = "mora-generator-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  # 리드 위에 겹쳐 부른 목소리를 갈라내, 괄호로 적힌 가사가 언제 불렸는지 재는 데 쓴다.
  "audio-separator>=0.44",
  "demucs>=4.0.1",
  "numpy>=2.0",
  "pyannote.audio>=4.0",
  "soundfile>=0.13",
  "torch>=2.7",
  # 여러 글자를 한 사전으로 맞추는 정렬기가 글자를 로마자로 옮길 때 쓴다.
  "uroman>=1.3",
  "whisperx>=3.4",
  # 유튜브는 미디어 주소에 JS 로 푸는 서명을 건다. 낡은 yt-dlp 는 403 만 받아 온다.
  "yt-dlp>=2026.8",
  "yt-dlp-ejs>=0.3"
]

[project.optional-dependencies]
# audio-separator 는 어떤 모델을 쓰든 onnxruntime 을 모듈 단계에서 불러온다. 우리가 쓰는
# roformer 는 순수 torch 라 실행에는 쓰이지 않지만, 없으면 import 부터 실패한다.
apple = ["mlx-whisper>=0.4", "onnxruntime>=1.17"]
cuda = ["onnxruntime-gpu>=1.17"]
