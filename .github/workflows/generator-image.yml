# Generator 이미지를 받아 쓸 수 있는 자리에 올린다.
#
# 지금까지 워커를 세우려면 빌린 기계마다 저장소를 받고, apt 를 깔고, torch·whisperx·demucs 를
# pip 로 세우고, gcc 가 없어 diffq 가 안 서는 것을 알아내야 했다. 오늘만 두 번 했다. 한 번
# 지어 두면 docker run 한 줄이면 된다.
name: Generator image
on:
  release:
    types: [published]
  push:
    # 이미지가 낡으면 그것으로 띄운 기계가 옛 코드로 돈다. 실제로 등록 토큰을 붙인 다음 판에서
    # 그 일이 났다 — 이미지는 그 전 판이라 PIN 을 물었다. 이미지를 짓게 하는 것이 바뀔 때마다
    # 다시 짓는다. 문서나 평가만 바뀐 판까지 9 GB 를 다시 밀 이유는 없다.
    branches: [main]
    paths:
      - "Generator/**"
      - "packages/**"
      - "Server/src/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/generator-image.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "이미지에 붙일 이름 (비우면 latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CUDA 와 torch 가 들어가는 이미지라 러너 기본 디스크로는 모자란다. 안 쓰는 것을 먼저
      # 비운다 — 이걸 안 하면 pip install 중간에 "no space left" 로 죽는다.
      - name: 디스크 비우기
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이름 정하기
        id: name
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          WANTED="${{ github.event.inputs.tag }}"
          if [ -z "$WANTED" ]; then
            WANTED="${{ github.event.release.tag_name }}"
          fi
          [ -z "$WANTED" ] && WANTED="${GITHUB_REF_NAME}"
          echo "tags=ghcr.io/$OWNER/mora-generator:$WANTED,ghcr.io/$OWNER/mora-generator:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Generator/Dockerfile
          push: true
          tags: ${{ steps.name.outputs.tags }}
          # 다음 판이 처음부터 다시 짓지 않도록 러너 캐시를 쓴다. torch 를 매번 받으면
          # 삼십 분이 그냥 나간다.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
